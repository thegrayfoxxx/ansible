---
- name: Nginx node purge — backup container + dir
  hosts: "{{ target | default('localhost', true) }}"
  gather_facts: false
  become: false
  serial: 1
  vars:
    nginx_purge_action: inspect
    nginx_purge_confirm: false
    nginx_purge_confirmed: false
    nginx_dir: /opt/nginx
    nginx_purge_container: ""
    nginx_purge_dir: ""
  tasks:
    - name: Validate purge action
      ansible.builtin.fail:
        msg: "nginx_purge_action must be inspect or purge, got '{{ nginx_purge_action }}'"
      when: nginx_purge_action not in ['inspect', 'purge']

    - name: Require fleet confirmation for multiple hosts
      ansible.builtin.fail:
        msg: "Purge on multiple hosts requires nginx_purge_confirmed=true"
      when:
        - nginx_purge_action == 'purge'
        - ansible_play_hosts_all | length > 1
        - not (nginx_purge_confirmed | default(false, true) | bool)

    - name: Require confirmation for purge
      ansible.builtin.fail:
        msg: "Purge is destructive. Set nginx_purge_confirm=true to allow action=purge"
      when:
        - nginx_purge_action == 'purge'
        - not (nginx_purge_confirm | bool)

    - name: Auto-discover backup containers
      ansible.builtin.shell: >-
        docker ps -a --format "{{ '{{.Names}}' }}" | grep -- '-bak-' || true
      register: nginx_purge_discovered_containers
      changed_when: false
      failed_when: false
      no_log: true

    - name: Auto-discover backup directories
      ansible.builtin.shell: >-
        find /opt /home /root /srv /var -maxdepth 3 -type d -name "*-bak-*" 2>/dev/null | sort -u || true
      register: nginx_purge_discovered_dirs
      changed_when: false
      failed_when: false

    - name: Show purge inspection
      when: nginx_purge_action == 'inspect'
      ansible.builtin.debug:
        msg: >-
          action={{ nginx_purge_action }} host={{ inventory_hostname }}
          discovered_containers={{ nginx_purge_discovered_containers.stdout_lines | default([]) | join(', ') or '(none)' }}
          discovered_dirs={{ nginx_purge_discovered_dirs.stdout_lines | default([]) | join(', ') or '(none)' }}
          explicit_container={{ nginx_purge_container | default('', true) }}
          explicit_dir={{ nginx_purge_dir | default('', true) }}

    - name: Stop after inspect (this host only)
      when: nginx_purge_action == 'inspect'
      ansible.builtin.meta: end_host

    - name: Resolve purge container (explicit or auto-discovered)
      when: nginx_purge_action == 'purge'
      ansible.builtin.set_fact:
        nginx_purge_container_resolved: >-
          {{ nginx_purge_container | default('', true) | trim
             if (nginx_purge_container | default('', true) | trim | length) > 0
             else (nginx_purge_discovered_containers.stdout_lines | default([]) | first | default('', true)) }}

    - name: Resolve purge dir (explicit or auto-discovered)
      when: nginx_purge_action == 'purge'
      ansible.builtin.set_fact:
        nginx_purge_dir_resolved: >-
          {{ nginx_purge_dir | default('', true) | trim
             if (nginx_purge_dir | default('', true) | trim | length) > 0
             else (nginx_purge_discovered_dirs.stdout_lines | default([]) | first | default('', true)) }}

    - name: Require purge artifacts for purge
      ansible.builtin.fail:
        msg: "Purge requires at least one of nginx_purge_container or nginx_purge_dir to be set (or auto-discovered backups found)"
      when:
        - nginx_purge_action == 'purge'
        - (nginx_purge_container_resolved | default('', true) | trim | length) == 0
        - (nginx_purge_dir_resolved | default('', true) | trim | length) == 0

    - name: Purge backup artifacts
      when: nginx_purge_action == 'purge'
      block:
        - name: Validate purge dir
          ansible.builtin.fail:
            msg: "Refusing to purge unsafe path '{{ nginx_purge_dir_resolved }}'. Set nginx_purge_dir to the backup dir"
          when: >-
            (nginx_purge_dir_resolved | length == 0)
            or (not (nginx_purge_dir_resolved is match('^/.+')))
            or ('..' in nginx_purge_dir_resolved)
            or ((nginx_purge_dir_resolved | regex_replace('/+$', '').split('/') | length) < 3)

        - name: Remove purge container
          ansible.builtin.command:
            argv: ["docker", "rm", "-f", "{{ nginx_purge_container_resolved }}"]
          changed_when: true
          when: (nginx_purge_container_resolved | default('', true) | trim | length) > 0

        - name: Remove purge dir
          ansible.builtin.file:
            path: "{{ nginx_purge_dir_resolved | regex_replace('/+$', '') }}"
            state: absent
          when: (nginx_purge_dir_resolved | default('', true) | trim | length) > 0
          become: true

    - name: Show purge summary
      when: nginx_purge_action == 'purge'
      ansible.builtin.debug:
        msg: "purged backup container={{ nginx_purge_container_resolved }} dir={{ nginx_purge_dir_resolved }} on {{ inventory_hostname }}"