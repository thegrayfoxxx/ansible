---
- name: Nginx fallback purge — backup containers + dirs
  hosts: "{{ target | default('localhost', true) }}"
  gather_facts: false
  # docker и find по /root без root молча возвращают пусто → "nothing to purge".
  become: true
  serial: 1
  vars:
    nginx_purge_action: inspect
    nginx_purge_confirm: false
    nginx_purge_confirmed: false
    nginx_dir: /opt/nginx
    # Явно: имена контейнеров / пути каталогов через запятую или по строке.
    # Пусто — все бэкапы nginx на хосте (inspect покажет список).
    nginx_purge_container: ""
    nginx_purge_dir: ""
  tasks:
    - name: Validate purge action
      ansible.builtin.fail:
        msg: "nginx_purge_action must be inspect or purge, got '{{ nginx_purge_action }}'"
      when: nginx_purge_action not in ['inspect', 'purge']

    - name: Require fleet confirmation for multiple hosts
      ansible.builtin.fail:
        msg: "Purge on multiple hosts requires nginx_purge_confirmed=true"
      when:
        - nginx_purge_action == 'purge'
        - ansible_play_hosts_all | length > 1
        - not (nginx_purge_confirmed | default(false, true) | bool)

    - name: Require confirmation for purge
      ansible.builtin.fail:
        msg: "Purge is destructive. Set nginx_purge_confirm=true to allow action=purge"
      when:
        - nginx_purge_action == 'purge'
        - not (nginx_purge_confirm | bool)

    - name: Find and purge nginx backups
      ansible.builtin.include_tasks: tasks/purge_backups.yml
      vars:
        purge_label: nginx
        purge_action: "{{ nginx_purge_action }}"
        # adopt сохраняет старые контейнеры под их собственными именами — отбираем по образу.
        purge_container_regex: '^.+-(adopt|move|moved)-bak-[0-9]+$'
        purge_image_regex: '(docker\.io/)?(library/)?nginx(:|@|$)|(docker\.io/)?neilpang/acme\.sh(:|@|$)'
        purge_dir_marker: 'nginx|acme\.sh'
        purge_dir_exclude: 'nginx-proxy-web'
        purge_dir_regex: '^/.*\.(adopt|move)-bak-[0-9]+$'
        purge_containers_explicit: "{{ nginx_purge_container }}"
        purge_dirs_explicit: "{{ nginx_purge_dir }}"
        purge_search_roots: [/opt, /srv, /root, /home]
