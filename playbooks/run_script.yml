---
- name: Run script from scripts/
  hosts: "{{ target }}"
  gather_facts: false
  become: true
  vars:
    script_src: ""
    script_args: ""
    script_env: {}
    script_become: true
    script_confirmed: false
  tasks:
    - name: Validate script_src is set
      ansible.builtin.fail:
        msg: "Set script_src as repo-root path, e.g. scripts/hello.sh (via Extra vars)"
      when: script_src | length == 0

    - name: Require confirmation for fleet script run
      ansible.builtin.fail:
        msg: "Running script on {{ ansible_play_hosts_all | length }} hosts at once needs script_confirmed=true. Set it in survey (or narrow target/Limit to one host)"
      when:
        - ansible_play_hosts_all | length > 1
        - not (script_confirmed | bool)

    - name: Validate script_src path
      ansible.builtin.fail:
        msg: "script_src must be a repo-root path under scripts/, e.g. scripts/hello.sh, got {{ script_src }}"
      when:
        - not (script_src is regex('^scripts/.+')) or ('..' in script_src)

    - name: Validate script_env is a JSON object
      ansible.builtin.fail:
        msg: "script_env must be a JSON object like {\"FOO\": \"1\"}, got {{ script_env }}"
      when:
        - script_env is string
        - script_env | length > 0
        - not (script_env | trim is regex('^\\{.*\\}$'))

    - name: Normalize script_env to dict
      ansible.builtin.set_fact:
        script_env_dict: "{{ (script_env | from_json) if (script_env is string and script_env | length > 0) else (script_env if script_env is mapping else {}) }}"

    - name: Run script
      ansible.builtin.script: "{{ playbook_dir }}/../{{ script_src }} {{ script_args }}"
      environment: "{{ script_env_dict }}"
      become: "{{ script_become }}"
      register: script_out
      changed_when: true

    - name: Show script return code
      ansible.builtin.debug:
        msg: "rc={{ script_out.rc }}"

    - name: Show script stdout
      ansible.builtin.debug:
        var: script_out.stdout_lines
      when: script_out.stdout_lines | length > 0

    - name: Show script stderr
      ansible.builtin.debug:
        var: script_out.stderr_lines
      when: script_out.stderr_lines | length > 0
