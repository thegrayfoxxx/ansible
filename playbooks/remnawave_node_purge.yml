---
- name: Remnawave node purge — backup container + dir
  hosts: "{{ target | default('localhost', true) }}"
  gather_facts: false
  become: false
  serial: 1
  vars:
    remnanawave_purge_action: inspect
    remnanawave_purge_confirm: false
    remnanode_dir: /opt/remnanode
    remnanode_agent_container: remnanode
    remnanode_purge_container: ""
    remnanode_purge_dir: ""
  tasks:
    - name: Validate purge action
      ansible.builtin.fail:
        msg: "remnanawave_purge_action must be inspect or purge, got '{{ remnanawave_purge_action }}'"
      when: remnanawave_purge_action not in ['inspect', 'purge']

    - name: Require purge artifacts for purge
      ansible.builtin.fail:
        msg: "Purge requires remnanode_purge_container and remnanode_purge_dir to be set"
      when:
        - remnanawave_purge_action == 'purge'
        - (remnanode_purge_container | default('', true) | trim | length) == 0 or (remnanode_purge_dir | default('', true) | trim | length) == 0

    - name: Require fleet confirmation for multiple hosts
      ansible.builtin.fail:
        msg: "Purge on multiple hosts requires remnanawave_purge_confirmed=true"
      when:
        - remnanawave_purge_action == 'purge'
        - ansible_play_hosts_all | length > 1
        - not (remnanawave_purge_confirmed | default(false, true) | bool)

    - name: Require confirmation for purge
      ansible.builtin.fail:
        msg: "Purge is destructive. Set remnanawave_purge_confirm=true to allow action=purge"
      when:
        - remnanawave_purge_action == 'purge'
        - not (remnanawave_purge_confirm | bool)

    - name: Inspect purge state
      when: remnanawave_purge_action == 'inspect'
      block:
        - name: Stat purge dir
          ansible.builtin.stat:
            path: "{{ remnanode_purge_dir | default('', true) }}"
          register: remnanode_purge_dir_stat
          when: (remnanode_purge_dir | default('', true) | trim | length) > 0

        - name: Inspect purge container
          ansible.builtin.command: docker inspect {{ remnanode_purge_container }}
          register: remnanode_purge_container_check
          changed_when: false
          failed_when: false
          no_log: true
          when: (remnanode_purge_container | default('', true) | trim | length) > 0

        - name: Show purge inspection
          ansible.builtin.debug:
            msg: >-
              action={{ remnanawave_purge_action }} host={{ inventory_hostname }}
              container={{ remnanode_purge_container | default('', true) }} exists={{ (remnanode_purge_container_check.rc | default(1) == 0) if (remnanode_purge_container | default('', true) | trim | length) > 0 else false }}
              dir={{ remnanode_purge_dir | default('', true) }} exists={{ remnanode_purge_dir_stat.stat.exists | default(false) if (remnanode_purge_dir | default('', true) | trim | length) > 0 else false }}

    - name: Stop after inspect (this host only)
      when: remnanawave_purge_action == 'inspect'
      ansible.builtin.meta: end_host

    - name: Purge backup artifacts
      when: remnanawave_purge_action == 'purge'
      block:
        - name: Validate purge dir
          ansible.builtin.fail:
            msg: "Refusing to purge unsafe path '{{ remnanode_purge_dir }}'. Set remnanode_purge_dir to the backup dir"
          when: >-
            (remnanode_purge_dir | length == 0)
            or (not (remnanode_purge_dir is match('^/.+')))
            or ('..' in remnanode_purge_dir)
            or ((remnanode_purge_dir | regex_replace('/+$', '').split('/') | length) < 3)

        - name: Remove purge container
          ansible.builtin.command:
            argv: ["docker", "rm", "-f", "{{ remnanode_purge_container }}"]
          changed_when: true
          when: (remnanode_purge_container | default('', true) | trim | length) > 0

        - name: Remove purge dir
          ansible.builtin.file:
            path: "{{ remnanode_purge_dir | regex_replace('/+$', '') }}"
            state: absent
          when: (remnanode_purge_dir | default('', true) | trim | length) > 0
          become: true

    - name: Show purge summary
      when: remnanawave_purge_action == 'purge'
      ansible.builtin.debug:
        msg: "purged backup container={{ remnanode_purge_container }} dir={{ remnanode_purge_dir }} on {{ inventory_hostname }}"
