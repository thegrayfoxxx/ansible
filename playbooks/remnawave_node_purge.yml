---
- name: Remnawave node purge — backup container + dir
  hosts: "{{ target | default('localhost', true) }}"
  gather_facts: false
  become: false
  serial: 1
  vars:
    remnanawave_purge_action: inspect
    remnanawave_purge_confirm: false
    remnanawave_purge_confirmed: false
    remnanode_dir: /opt/remnanode
    remnanode_agent_container: remnanode
    remnanode_purge_container: ""
    remnanode_purge_dir: ""
  tasks:
    - name: Validate purge action
      ansible.builtin.fail:
        msg: "remnanawave_purge_action must be inspect or purge, got '{{ remnanawave_purge_action }}'"
      when: remnanawave_purge_action not in ['inspect', 'purge']

    - name: Require fleet confirmation for multiple hosts
      ansible.builtin.fail:
        msg: "Purge on multiple hosts requires remnanawave_purge_confirmed=true"
      when:
        - remnanawave_purge_action == 'purge'
        - ansible_play_hosts_all | length > 1
        - not (remnanawave_purge_confirmed | default(false, true) | bool)

    - name: Require confirmation for purge
      ansible.builtin.fail:
        msg: "Purge is destructive. Set remnanawave_purge_confirm=true to allow action=purge"
      when:
        - remnanawave_purge_action == 'purge'
        - not (remnanawave_purge_confirm | bool)

    - name: Auto-discover backup containers
      ansible.builtin.command: >-
        docker ps -a --filter "name={{ remnanode_agent_container }}-move-bak"
        --filter "name={{ remnanode_agent_container }}-moved-bak"
        --filter "name={{ remnanode_agent_container }}-adopt-bak"
        --format "{{ '{{.Names}}' }}"
      register: remnanode_purge_discovered_containers
      changed_when: false
      failed_when: false
      no_log: true

    - name: Auto-discover backup directories
      ansible.builtin.shell: >-
        find {{ remnanode_dir | regex_replace('/[^/]+$', '') }} /opt -maxdepth 1 -type d
        \( -name "*.move-bak-*" -o -name "*.moved-bak-*" -o -name "*.adopt-bak-*" \) 2>/dev/null || true
      register: remnanode_purge_discovered_dirs
      changed_when: false
      failed_when: false
      no_log: true

    - name: Show purge inspection
      when: remnanawave_purge_action == 'inspect'
      ansible.builtin.debug:
        msg: >-
          action={{ remnanawave_purge_action }} host={{ inventory_hostname }}
          discovered_containers={{ remnanode_purge_discovered_containers.stdout_lines | default([]) | join(', ') or '(none)' }}
          discovered_dirs={{ remnanode_purge_discovered_dirs.stdout_lines | default([]) | join(', ') or '(none)' }}
          explicit_container={{ remnanode_purge_container | default('', true) }}
          explicit_dir={{ remnanode_purge_dir | default('', true) }}

    - name: Stop after inspect (this host only)
      when: remnanawave_purge_action == 'inspect'
      ansible.builtin.meta: end_host

    - name: Resolve purge container (explicit or auto-discovered)
      when: remnanawave_purge_action == 'purge'
      ansible.builtin.set_fact:
        remnanode_purge_container_resolved: >-
          {{ remnanode_purge_container | default('', true) | trim
             if (remnanode_purge_container | default('', true) | trim | length) > 0
             else (remnanode_purge_discovered_containers.stdout_lines | default([]) | first | default('', true)) }}

    - name: Resolve purge dir (explicit or auto-discovered)
      when: remnanawave_purge_action == 'purge'
      ansible.builtin.set_fact:
        remnanode_purge_dir_resolved: >-
          {{ remnanode_purge_dir | default('', true) | trim
             if (remnanode_purge_dir | default('', true) | trim | length) > 0
             else (remnanode_purge_discovered_dirs.stdout_lines | default([]) | first | default('', true)) }}

    - name: Require purge artifacts for purge
      ansible.builtin.fail:
        msg: "Purge requires at least one of remnanode_purge_container or remnanode_purge_dir to be set (or auto-discovered backups found)"
      when:
        - remnanawave_purge_action == 'purge'
        - (remnanode_purge_container_resolved | default('', true) | trim | length) == 0
        - (remnanode_purge_dir_resolved | default('', true) | trim | length) == 0

    - name: Purge backup artifacts
      when: remnanawave_purge_action == 'purge'
      block:
        - name: Validate purge dir
          ansible.builtin.fail:
            msg: "Refusing to purge unsafe path '{{ remnanode_purge_dir_resolved }}'. Set remnanode_purge_dir to the backup dir"
          when: >-
            (remnanode_purge_dir_resolved | length == 0)
            or (not (remnanode_purge_dir_resolved is match('^/.+')))
            or ('..' in remnanode_purge_dir_resolved)
            or ((remnanode_purge_dir_resolved | regex_replace('/+$', '').split('/') | length) < 3)

        - name: Remove purge container
          ansible.builtin.command:
            argv: ["docker", "rm", "-f", "{{ remnanode_purge_container_resolved }}"]
          changed_when: true
          when: (remnanode_purge_container_resolved | default('', true) | trim | length) > 0

        - name: Remove purge dir
          ansible.builtin.file:
            path: "{{ remnanode_purge_dir_resolved | regex_replace('/+$', '') }}"
            state: absent
          when: (remnanode_purge_dir_resolved | default('', true) | trim | length) > 0
          become: true

    - name: Show purge summary
      when: remnanawave_purge_action == 'purge'
      ansible.builtin.debug:
        msg: "purged backup container={{ remnanode_purge_container_resolved }} dir={{ remnanode_purge_dir_resolved }} on {{ inventory_hostname }}"
