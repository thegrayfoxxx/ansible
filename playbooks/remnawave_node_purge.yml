---
- name: Remnawave node purge — backup containers + dirs
  hosts: "{{ target | default('localhost', true) }}"
  gather_facts: false
  # docker и find по /root без root молча возвращают пусто → "nothing to purge".
  become: true
  serial: 1
  vars:
    remnawave_purge_action: inspect
    remnawave_purge_confirm: false
    remnawave_purge_confirmed: false
    remnanode_dir: /opt/remnanode
    remnanode_agent_container: remnanode
    # Явно: имена контейнеров / пути каталогов через запятую или по строке.
    # Пусто — все бэкапы remnanode на хосте (inspect покажет список).
    remnanode_purge_container: ""
    remnanode_purge_dir: ""
  tasks:
    - name: Validate purge action
      ansible.builtin.fail:
        msg: "remnawave_purge_action must be inspect or purge, got '{{ remnawave_purge_action }}'"
      when: remnawave_purge_action not in ['inspect', 'purge']

    - name: Require fleet confirmation for multiple hosts
      ansible.builtin.fail:
        msg: "Purge on multiple hosts requires remnawave_purge_confirmed=true"
      when:
        - remnawave_purge_action == 'purge'
        - ansible_play_hosts_all | length > 1
        - not (remnawave_purge_confirmed | default(false, true) | bool)

    - name: Require confirmation for purge
      ansible.builtin.fail:
        msg: "Purge is destructive. Set remnawave_purge_confirm=true to allow action=purge"
      when:
        - remnawave_purge_action == 'purge'
        - not (remnawave_purge_confirm | bool)

    - name: Find and purge remnanode backups
      ansible.builtin.include_tasks: tasks/purge_backups.yml
      vars:
        purge_label: remnanode
        purge_action: "{{ remnawave_purge_action }}"
        purge_container_regex: "^{{ ((remnanode_agent_container | default('', true) | trim) or 'remnanode') | regex_escape }}-(adopt|move|moved)-bak-[0-9]+$"
        purge_dir_regex: '^/.*\.(adopt|move)-bak-[0-9]+$'
        purge_dir_marker: "remnawave/node|container_name: *{{ ((remnanode_agent_container | default('', true) | trim) or 'remnanode') | regex_escape }}$"
        purge_containers_explicit: "{{ remnanode_purge_container }}"
        purge_dirs_explicit: "{{ remnanode_purge_dir }}"
        purge_search_roots: [/opt, /srv, /root, /home]
