---
- name: Install Docker Engine
  hosts: "{{ target | default('all') }}"
  gather_facts: true
  become: true
  vars:
    docker_users: []
    docker_verify: true
    docker_version: ""
    docker_prereqs:
      - ca-certificates
      - curl
      - gnupg
    docker_rest_pkgs:
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    docker_legacy_pkgs:
      - docker.io
      - docker-doc
      - podman-docker
      - containerd
      - runc
  tasks:
    - name: Guard Debian family only
      ansible.builtin.fail:
        msg: "playbooks/docker.yml supports Debian only, got {{ ansible_facts.distribution }} {{ ansible_facts.distribution_release }}"
      when: ansible_facts.os_family != "Debian"

    - name: Normalize docker_users to list
      ansible.builtin.set_fact:
        docker_users_list: "{{ docker_users.replace(',', '\n').splitlines() | map('trim') | select | list if docker_users is string else docker_users }}"

    - name: Remove conflicting packages
      ansible.builtin.apt:
        name: "{{ docker_legacy_pkgs }}"
        state: absent
      register: docker_purged
      failed_when: false

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name: "{{ docker_prereqs }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: false

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_facts.architecture, ansible_facts.architecture) }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_facts.distribution | lower }} {{ ansible_facts.distribution_release }} stable"
        state: present
        filename: docker

    - name: Resolve Docker engine packages (pin version when requested)
      ansible.builtin.set_fact:
        docker_engine_pkgs: "{{ ['docker-ce=' + docker_version, 'docker-ce-cli=' + docker_version] if docker_version | length > 0 else ['docker-ce', 'docker-ce-cli'] }}"

    - name: Install Docker packages
      ansible.builtin.apt:
        name: "{{ docker_engine_pkgs + docker_rest_pkgs }}"
        state: present
        update_cache: true

    - name: Ensure Docker service is started and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add users to docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_users_list }}"
      when: docker_users_list | length > 0

    - name: Verify Docker with hello-world
      ansible.builtin.command: docker run --rm hello-world
      register: docker_hello
      changed_when: false
      when: docker_verify | bool

    - name: Show Docker version
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      ansible.builtin.debug:
        var: docker_version.stdout
