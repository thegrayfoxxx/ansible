---
- name: Init new node - SSH keys + sshd hardening
  hosts: "{{ target | default('all') }}"
  gather_facts: false
  become: true
  vars:
    ssh_user: root
    ssh_keys: []
    skip_sshd: false
    sshd_permit_root_login: prohibit-password
    sshd_pubkey_auth: "yes"
    sshd_password_auth: "no"
    sshd_permit_empty: "no"
  tasks:
    - name: Normalize ssh_keys to list
      ansible.builtin.set_fact:
        ssh_keys_list: "{{ ssh_keys.replace(',', '\n').splitlines() | map('trim') | select | list if ssh_keys is string else ssh_keys }}"
      tags: [keys, sshd]

    - name: Validate ssh_keys is not empty
      ansible.builtin.fail:
        msg: "Set ssh_keys via survey/Text, one key per line or comma-separated"
      when: ssh_keys_list | length == 0
      tags: [keys, sshd]

    - name: Add public keys
      ansible.posix.authorized_key:
        user: "{{ ssh_user }}"
        key: "{{ item }}"
        state: present
        exclusive: false
      loop: "{{ ssh_keys_list }}"
      tags: [keys]

    - name: Harden sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?{{ item.key }}\\b.*"
        line: "{{ item.key }} {{ item.value }}"
        backup: true
        validate: sshd -t -f %s
      loop:
        - {key: PermitRootLogin, value: "{{ sshd_permit_root_login }}"}
        - {key: PubkeyAuthentication, value: "{{ sshd_pubkey_auth }}"}
        - {key: PasswordAuthentication, value: "{{ sshd_password_auth }}"}
        - {key: PermitEmptyPasswords, value: "{{ sshd_permit_empty }}"}
      notify: Restart ssh
      when: not (skip_sshd | bool)
      tags: [sshd]

    - name: Apply sshd restart now
      ansible.builtin.meta: flush_handlers
      when: not (skip_sshd | bool)
      tags: [sshd]

    - name: Confirm SSH still reachable
      ansible.builtin.wait_for_connection:
        timeout: 60
      when: not (skip_sshd | bool)
      tags: [sshd]

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: reloaded
