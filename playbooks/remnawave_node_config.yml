---
- name: Remnawave node config (host-side show/apply)
  hosts: "{{ target }}"
  gather_facts: false
  become: true
  vars:
    remnawave_config_action: show
    remnanode_dir: /opt/remnanode
    remnanode_old_dir: ""
    remnanode_agent_container: remnanode
    remnanode_mount_shm: ""
    remnanode_mount_logs: ""
    # keep — preserve the current host value; an explicit value changes it.
    remnanode_log_dir: keep
    remnanode_log_max_size: keep
    remnanode_log_keep: keep
    remnanode_geo_files: keep
    remnanode_zapret_mode: keep
    remnanode_xray_mode: ""
    remnanode_xray_version: ""
    remnanode_validate_xray: false
  tasks:
    - name: Validate config action
      ansible.builtin.fail:
        msg: "remnawave_config_action must be show or apply, got '{{ remnawave_config_action }}'"
      when: remnawave_config_action not in ['show', 'apply']

    - name: Require exactly one node host
      ansible.builtin.fail:
        msg: "Config addresses one node per run — point target at a single host, got {{ ansible_play_hosts_all | length }}"
      when: ansible_play_hosts_all | length != 1

    - name: Capture raw config input
      ansible.builtin.set_fact:
        remnanode_cfg_input_shm: "{{ remnanode_mount_shm }}"
        remnanode_cfg_input_logs: "{{ remnanode_mount_logs }}"
        remnanode_cfg_input_log_dir: "{{ remnanode_log_dir }}"
        remnanode_cfg_input_log_max_size: "{{ remnanode_log_max_size }}"
        remnanode_cfg_input_log_keep: "{{ remnanode_log_keep }}"
        remnanode_cfg_input_xray_mode: "{{ remnanode_xray_mode }}"
        remnanode_cfg_input_xray_version: "{{ remnanode_xray_version }}"

    - name: Normalize node settings
      ansible.builtin.include_role:
        name: remnanode
        tasks_from: normalize

    - name: Discover host state
      ansible.builtin.include_role:
        name: remnanode
        tasks_from: discover

    - name: Require a deployed stack
      ansible.builtin.fail:
        msg: "No compose.yml in {{ remnanode_dir }}. Run remnawave_node_deploy first"
      when: not (remnanode_target_compose_exists | bool)

    - name: Require a stack container
      ansible.builtin.fail:
        msg: "Container '{{ remnanode_agent_container }}' not found. Run remnawave_node_deploy with remnanode_force=true to recreate the stack"
      when: not (remnanode_container_exists | bool)

    - name: Refuse a stack that lives in another directory
      ansible.builtin.fail:
        msg: "Existing remnanode stack lives in {{ remnanode_old_dir_final }}, not in {{ remnanode_dir }}. Use remnawave_node_move scope=local first"
      when: (remnanode_old_dir_final | regex_replace('/+$', '')) != (remnanode_dir | regex_replace('/+$', ''))

    - name: Warn about unmanaged geodata mounts
      ansible.builtin.debug:
        msg: >-
          Unmanaged mounts under /usr/local/share/xray were found:
          {{ remnanode_geo_foreign_mounts | map(attribute='Destination') | join(', ') }}.
          config only manages files in {{ remnanode_geo_dir }}; move them there and re-run.
      when: remnanode_geo_foreign_mounts | length > 0

    - name: Warn about an unmanaged zapret mount
      ansible.builtin.debug:
        msg: >-
          zapret.dat is mounted from {{ remnanode_zapret_mount_source_current }}
          outside {{ remnanode_geo_source_dir }}; move it into
          {{ remnanode_geo_dir }} and re-run.
      when: remnanode_zapret_foreign | bool

    - name: Resolve desired geodata settings
      ansible.builtin.set_fact:
        remnanode_geo_files_effective: >-
          {{ (remnanode_geo_files_current
              if remnanode_geo_files_mode == 'keep'
              else ([] if remnanode_geo_files_mode == 'none' else remnanode_geo_files_names))
             | sort }}
        remnanode_zapret_mode_effective: "{{ remnanode_zapret_mode_norm }}"
        remnanode_mount_zapret_effective: >-
          {{ false if remnanode_zapret_mode_norm == 'off'
             else (true if remnanode_zapret_mode_norm in ['present', 'latest']
                   else (remnanode_zapret_current | bool)) }}

    - name: Refuse to replace unmanaged geodata mounts
      ansible.builtin.fail:
        msg: >-
          The stack has unmanaged mounts under /usr/local/share/xray or
          /usr/local/bin/zapret.dat. config would drop them on apply. Move the
          files into {{ remnanode_geo_dir }} and re-run, or set
          remnanode_geo_files=none and remnanode_zapret_mode=off to remove them.
      when:
        - remnawave_config_action == 'apply'
        - (remnanode_geo_foreign_mounts | length > 0 and remnanode_geo_files_mode != 'none')
          or (remnanode_zapret_foreign | bool and remnanode_mount_zapret_effective | bool)

    - name: Read current credentials for display
      ansible.builtin.set_fact:
        remnanode_require_credentials: false

    - name: Discover current credentials
      ansible.builtin.include_role:
        name: remnanode
        tasks_from: credentials

    - name: Resolve desired mount and xray values
      ansible.builtin.set_fact:
        remnanode_mount_shm_effective: >-
          {{ remnanode_existing_mount_shm | bool
             if ((remnanode_cfg_input_shm | default('', true) | string | trim | lower) in ['', 'keep', 'current'])
             else (remnanode_cfg_input_shm | bool) }}
        remnanode_mount_logs_effective: >-
          {{ remnanode_existing_mount_logs | bool
             if ((remnanode_cfg_input_logs | default('', true) | string | trim | lower) in ['', 'keep', 'current'])
             else (remnanode_cfg_input_logs | bool) }}
        remnanode_xray_mode: "{{ (remnanode_cfg_input_xray_mode | default('', true) | string | trim) or 'keep' }}"
        remnanode_xray_version: "{{ remnanode_cfg_input_xray_version | default('', true) }}"

    - name: Resolve desired log values
      ansible.builtin.set_fact:
        remnanode_log_dir_effective: >-
          {{ (remnanode_cfg_input_log_dir | default('', true) | string | trim)
             if ((remnanode_cfg_input_log_dir | default('', true) | string | trim | lower) not in ['', 'keep', 'current'])
             else ((remnanode_log_dir_current
                    if ((remnanode_mount_logs_effective | bool) and (remnanode_existing_mount_logs | bool) and ((remnanode_log_dir_current | default('', true) | length) > 0))
                    else '')
                   or '/var/log/remnanode') }}
        remnanode_log_max_size_effective: >-
          {{ (remnanode_cfg_input_log_max_size | default('', true) | string | trim)
             if ((remnanode_cfg_input_log_max_size | default('', true) | string | trim | lower) not in ['', 'keep', 'current'])
             else ((remnanode_log_max_size_current | default('', true) | string | trim) or '100M') }}
        remnanode_log_keep_effective: >-
          {{ (remnanode_cfg_input_log_keep | default('', true) | string | trim)
             if ((remnanode_cfg_input_log_keep | default('', true) | string | trim | lower) not in ['', 'keep', 'current'])
             else ((remnanode_log_keep_current | default('', true) | string | trim) or '5') }}

    - name: Resolve desired mount flags
      ansible.builtin.set_fact:
        remnanode_mount_shm_effective: "{{ remnanode_mount_shm_effective | bool }}"
        remnanode_mount_logs_effective: "{{ remnanode_mount_logs_effective | bool }}"

    - name: Stat desired geodata files
      ansible.builtin.stat:
        path: "{{ remnanode_geo_dir }}/{{ item }}"
      loop: "{{ remnanode_geo_files_effective }}"
      register: remnanode_cfg_geo_stat

    - name: Reset missing geodata files
      ansible.builtin.set_fact:
        remnanode_cfg_geo_missing: []

    - name: Resolve missing geodata files
      ansible.builtin.set_fact:
        remnanode_cfg_geo_missing: >-
          {{ remnanode_cfg_geo_missing
             + ([item.item]
                if ((not (item.stat.exists | default(false)))
                    or (not (item.stat.isreg | default(false)))
                    or ((item.stat.size | default(0) | int) == 0))
                else []) }}
      loop: "{{ remnanode_cfg_geo_stat.results | default([]) }}"

    - name: Stat current zapret file
      ansible.builtin.stat:
        path: "{{ remnanode_zapret_file }}"
      register: remnanode_cfg_zapret_stat
      when: remnanode_mount_zapret_effective | bool

    - name: Resolve current zapret file presence
      ansible.builtin.set_fact:
        remnanode_cfg_zapret_exists: >-
          {{ ((remnanode_cfg_zapret_stat.stat.exists | default(false))
              and (remnanode_cfg_zapret_stat.stat.isreg | default(false))
              and (remnanode_cfg_zapret_stat.stat.size | default(0) | int > 0))
             if (remnanode_mount_zapret_effective | bool) else false }}

    - name: Validate resolved config
      ansible.builtin.set_fact:
        remnanode_validate_xray: true

    - name: Re-validate resolved config
      ansible.builtin.include_role:
        name: remnanode
        tasks_from: normalize

    - name: Compute config changes
      ansible.builtin.set_fact:
        remnanode_cfg_shm_changed: "{{ (remnanode_mount_shm_effective | bool) != (remnanode_existing_mount_shm | bool) }}"
        remnanode_cfg_logs_changed: "{{ (remnanode_mount_logs_effective | bool) != (remnanode_existing_mount_logs | bool) }}"
        remnanode_cfg_log_dir_changed: >-
          {{ (remnanode_mount_logs_effective | bool)
             and ((remnanode_log_dir_current | default('', true) | regex_replace('/+$', '')) != (remnanode_log_dir_effective | regex_replace('/+$', ''))) }}
        remnanode_cfg_logrotate_changed: >-
          {{ (not (remnanode_mount_logs_effective | bool) and (remnanode_logrotate_exists | bool))
             or ((remnanode_mount_logs_effective | bool)
                 and ((not (remnanode_logrotate_exists | bool))
                      or (remnanode_log_max_size_current | default('') != remnanode_log_max_size_effective)
                      or ((remnanode_log_keep_current | default('') | string) != (remnanode_log_keep_effective | string)))) }}
        remnanode_cfg_geo_changed: >-
          {{ ((remnanode_geo_files_effective | sort) != (remnanode_geo_files_current | sort))
             or (remnanode_cfg_geo_missing | default([]) | length > 0) }}
        remnanode_cfg_zapret_changed: >-
          {{ ((remnanode_mount_zapret_effective | bool) != (remnanode_zapret_current | bool))
             or (remnanode_zapret_mode_norm == 'latest')
             or ((remnanode_mount_zapret_effective | bool)
                 and not (remnanode_cfg_zapret_exists | bool)) }}

    - name: Show current config
      when: remnawave_config_action == 'show'
      block:
        - name: Check firewall state
          ansible.builtin.include_role:
            name: remnanode
            tasks_from: ufw_check

        - name: Show config summary
          ansible.builtin.debug:
            msg:
              - "host={{ inventory_hostname }} dir={{ remnanode_dir }} container={{ remnanode_agent_container }} running={{ remnanode_container_running }}"
              - "image={{ remnanode_image_current }} port={{ remnanode_port_final | default('?') }} creds_from={{ remnanode_creds_source }}"
              - "mounts: shm={{ remnanode_existing_mount_shm }} logs={{ remnanode_existing_mount_logs }} xray={{ remnanode_existing_mount_xray }} log_dir={{ remnanode_log_dir_current | default('(none)') }}"
              - "geo: files={{ remnanode_geo_files_current | join(', ') or '(none)' }} dir={{ remnanode_geo_dir }} missing={{ remnanode_cfg_geo_missing | default([]) | join(', ') or '(none)' }}"
              - "zapret: mounted={{ remnanode_zapret_current }} file={{ remnanode_geo_dir }}/zapret.dat present={{ remnanode_cfg_zapret_exists | default(false) }}"
              - "logrotate: file={{ remnanode_logrotate_exists }} size={{ remnanode_log_max_size_current | default('?') }} keep={{ remnanode_log_keep_current | default('?') }}"
              - "xray: custom={{ remnanode_existing_custom_xray }} version={{ remnanode_xray_version_current | default('(unknown)') }} mount_source={{ remnanode_xray_mount_source | default('(none)') }}"
              - "ufw={{ remnanode_ufw_state }} port_fw={{ remnanode_port_fw }}"
        - name: Stop after show
          ansible.builtin.meta: end_play

    - name: Resolve xray intent
      ansible.builtin.include_role:
        name: remnanode
        tasks_from: xray

    - name: Resolve total config change
      ansible.builtin.set_fact:
        remnanode_cfg_changed: >-
          {{ (remnanode_cfg_shm_changed | bool) or (remnanode_cfg_logs_changed | bool)
             or (remnanode_cfg_log_dir_changed | bool) or (remnanode_cfg_logrotate_changed | bool)
             or (remnanode_cfg_geo_changed | bool) or (remnanode_cfg_zapret_changed | bool)
             or (remnanode_xray_changed | bool) }}

    - name: Report no changes
      ansible.builtin.debug:
        msg: "No config changes for {{ inventory_hostname }} ({{ remnanode_dir }})"
      when: not (remnanode_cfg_changed | bool)

    - name: Stop when there is nothing to apply
      ansible.builtin.meta: end_play
      when: not (remnanode_cfg_changed | bool)

    - name: Require geodata files before apply
      ansible.builtin.fail:
        msg: >-
          Geodata file '{{ item }}' is missing in {{ remnanode_geo_dir }}.
          Place it there first (scp/wget), then re-run.
      loop: "{{ remnanode_cfg_geo_missing | default([]) }}"
      when: remnanode_cfg_geo_missing | default([]) | length > 0

    - name: Require zapret file before apply
      ansible.builtin.fail:
        msg: >-
          zapret.dat is mounted but missing at {{ remnanode_zapret_file }}.
          Set remnanode_zapret_mode=present or latest to download it, or restore the file.
      when:
        - remnanode_mount_zapret_effective | bool
        - not (remnanode_cfg_zapret_exists | bool)
        - remnanode_zapret_mode_norm not in ['present', 'latest']

    - name: Require usable credentials for apply
      ansible.builtin.set_fact:
        remnanode_require_credentials: true

    - name: Validate current credentials before apply
      ansible.builtin.include_role:
        name: remnanode
        tasks_from: credentials

    - name: Keep the current image
      ansible.builtin.set_fact:
        remnanode_node_image: "{{ remnanode_image_current }}"

    - name: Require a known current image
      ansible.builtin.fail:
        msg: "Cannot determine the current image for '{{ remnanode_agent_container }}'. Use remnawave_node_update or remnawave_node_deploy remnanode_force=true"
      when: remnanode_node_image | default('') | trim | length == 0

    - name: Ensure geodata and zapret files
      ansible.builtin.include_role:
        name: remnanode
        tasks_from: geo

    - name: Render stack files
      ansible.builtin.include_role:
        name: remnanode
        tasks_from: render

    - name: Apply stack config
      ansible.builtin.include_role:
        name: remnanode
        tasks_from: up

    - name: Show apply summary
      ansible.builtin.debug:
        msg: "applied host={{ inventory_hostname }} dir={{ remnanode_dir }} shm={{ remnanode_mount_shm_effective }} logs={{ remnanode_mount_logs_effective }} log_dir={{ remnanode_log_dir_effective }} log_size={{ remnanode_log_max_size_effective }} log_keep={{ remnanode_log_keep_effective }} geo={{ remnanode_geo_files_effective | join(',') or '(none)' }} zapret={{ remnanode_mount_zapret_effective }}({{ remnanode_zapret_mode_norm }}) xray={{ remnanode_xray_summary }} port={{ remnanode_port_final }} image={{ remnanode_node_image }} ufw={{ remnanode_ufw_state }} port_fw={{ remnanode_port_fw }}"
