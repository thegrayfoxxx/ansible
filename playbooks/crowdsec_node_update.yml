---
- name: CrowdSec node update (pull + recreate only when an image changed)
  hosts: "{{ target }}"
  gather_facts: false
  become: true
  # По одной ноде: down/up снимал правила баунсера сразу на всём флоте.
  serial: 1
  vars:
    crowdsec_dir: /opt/crowdsec
    crowdsec_agent_container: crowdsec-agent
  tasks:
    - name: Normalize project dir
      ansible.builtin.set_fact:
        crowdsec_dir: "{{ (crowdsec_dir | default('') | trim) or '/opt/crowdsec' }}"

    - name: Validate project dir
      ansible.builtin.fail:
        msg: "crowdsec_dir must be an absolute path, got '{{ crowdsec_dir }}'"
      when: not (crowdsec_dir is match('^/.+'))

    - name: Check docker is available
      ansible.builtin.shell: command -v docker
      args:
        executable: /bin/bash
      register: crowdsec_docker_bin
      changed_when: false
      failed_when: false

    - name: Require docker on node
      ansible.builtin.fail:
        msg: "docker not found. Run the docker template on this host first"
      when: crowdsec_docker_bin.rc != 0

    - name: Check compose file exists
      ansible.builtin.stat:
        path: "{{ crowdsec_dir }}/compose.yml"
      register: crowdsec_compose

    - name: Require deployed stack
      ansible.builtin.fail:
        msg: "No compose.yml in {{ crowdsec_dir }}. Run crowdsec_node with action deploy first"
      when: not crowdsec_compose.stat.exists

    # Раньше: проверка 'Downloaded' (в compose v2 такой строки нет) и безусловный
    # down/up — баунсер снимал правила на каждом прогоне.
    - name: Pull images and recreate only changed containers
      community.docker.docker_compose_v2:
        project_src: "{{ crowdsec_dir }}"
        state: present
        pull: always
      register: crowdsec_up

    - name: Check agent answers LAPI
      ansible.builtin.command: docker exec {{ crowdsec_agent_container }} cscli lapi status
      register: crowdsec_agent_status
      changed_when: false
      retries: 6
      delay: 10
      until: crowdsec_agent_status.rc == 0

    - name: Check bouncer is running
      ansible.builtin.command:
        argv: ["docker", "inspect", "-f", "{{ '{{' }}.State.Running{{ '}}' }}", "crowdsec-bouncer"]
      register: crowdsec_bouncer_running
      changed_when: false
      retries: 6
      delay: 5
      until: crowdsec_bouncer_running.rc == 0 and (crowdsec_bouncer_running.stdout | trim) == 'true'

    - name: Show update summary
      ansible.builtin.debug:
        msg: "updated {{ crowdsec_dir }}: {{ 'images changed, containers recreated' if (crowdsec_up is changed) else 'already up to date' }}"
