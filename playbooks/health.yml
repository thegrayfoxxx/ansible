---
- name: Node health summary (read-only)
  hosts: "{{ target }}"
  gather_facts: true
  become: true
  tasks:
    - name: Disk usage of root filesystem
      ansible.builtin.command: df -h /
      register: health_df
      changed_when: false

    - name: Read load average
      ansible.builtin.command: cat /proc/loadavg
      register: health_loadavg
      changed_when: false

    - name: Check docker is available
      ansible.builtin.shell: command -v docker
      args:
        executable: /bin/bash
      register: health_docker
      changed_when: false
      failed_when: false

    - name: List docker containers
      ansible.builtin.command: docker ps --format json
      register: health_ps
      changed_when: false
      failed_when: false
      when: health_docker.rc == 0

    - name: Check fail2ban state
      ansible.builtin.command: systemctl is-active fail2ban
      register: health_f2b
      changed_when: false
      failed_when: false

    # `systemctl is-active` для несуществующего юнита пишет "inactive" без текста ошибки.
    - name: Check fail2ban unit exists
      ansible.builtin.command: systemctl show -p LoadState --value fail2ban
      register: health_f2b_load
      changed_when: false
      failed_when: false

    - name: Check crowdsec agent answers LAPI
      ansible.builtin.command: docker exec crowdsec-agent cscli lapi status
      register: health_cs
      changed_when: false
      failed_when: false
      when: health_docker.rc == 0

    # Только статус: полный inspect содержит env с SECRET_KEY.
    - name: Inspect remnawave agent container
      ansible.builtin.command: "docker inspect -f '{{ '{{' }}.State.Status{{ '}}' }}' remnanode"
      register: health_remna
      changed_when: false
      failed_when: false
      when: health_docker.rc == 0

    - name: Build health summary
      ansible.builtin.set_fact:
        health_summary: "uptime={{ health_uptime_h }}h load={{ health_load }} mem={{ health_mem }} disk={{ health_disk }} containers={{ health_n }} fail2ban={{ health_f2b_state }} crowdsec={{ health_cs_state }} remnanode={{ health_remna_state }}"
      vars:
        health_uptime_h: "{{ ansible_facts.uptime_seconds | int // 3600 }}"
        health_load: "{{ (health_loadavg.stdout.split()[0]) if (health_loadavg.stdout | default('') | length > 0) else 'n/a' }}"
        health_mem_t: "{{ ansible_facts.memory_mb.nocache.total | default(ansible_facts.memory_mb.real.total | default(0)) }}"
        health_mem_u: "{{ ansible_facts.memory_mb.nocache.used | default(ansible_facts.memory_mb.real.used | default(0)) }}"
        health_mem_pct: "{{ ((health_mem_u | int / health_mem_t | int * 100) | round | int) if (health_mem_t | int > 0) else -1 }}"
        health_mem: "{{ '%s/%sMB(%s%%%s)' % (health_mem_u, health_mem_t, health_mem_pct, '(!)' if (health_mem_pct | int > 90) else '') if (health_mem_t | int > 0) else 'n/a' }}"
        health_disk_raw: "{{ ((health_df.stdout_lines | last).split()[4]) if (health_df.stdout_lines | default([]) | length > 1) else '' }}"
        health_disk: "{{ (health_disk_raw + '(!)' if (health_disk_raw | regex_replace('%', '') | int > 80) else health_disk_raw) if ((health_disk_raw | length > 0) and (health_disk_raw | regex_replace('%', '') is match('^[0-9]+$'))) else 'n/a' }}"
        health_n: "{{ health_ps.stdout_lines | default([]) | length if (health_docker.rc == 0) else 'n/a' }}"
        health_f2b_state: "{{ 'active' if (health_f2b.stdout | default('') | trim == 'active') else ('missing' if (health_f2b_load.stdout | default('') | trim) == 'not-found' else 'inactive') }}"
        health_cs_state: "{{ 'n/a' if (health_docker.rc != 0) else ('ok' if (health_cs.rc | default(1) | int == 0) else ('na' if 'No such container' in ((health_cs.stdout | default('')) + (health_cs.stderr | default(''))) else 'fail')) }}"
        health_remna_state: "{{ 'n/a' if (health_docker.rc != 0) else ('na' if (health_remna.rc | default(1) | int != 0) else ('up' if (health_remna.stdout | default('') | trim) == 'running' else 'stopped')) }}"

    - name: Summarize docker containers
      ansible.builtin.set_fact:
        health_containers: "{{ health_containers | default([]) + [item.Names + ' (' + item.Image + ') — ' + item.State + '/' + item.Status] }}"
      loop: "{{ health_ps.stdout_lines | default([]) | map('from_json') | list }}"
      when: health_docker.rc == 0

    - name: Show docker containers
      ansible.builtin.debug:
        var: health_containers
      when:
        - health_docker.rc == 0
        - health_containers | default([]) | length > 0

    - name: Show health summary
      ansible.builtin.debug:
        var: health_summary
