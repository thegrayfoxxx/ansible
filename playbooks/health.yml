---
- name: Node health summary (read-only)
  hosts: "{{ target }}"
  gather_facts: true
  become: true
  tasks:
    - name: Disk usage of root filesystem
      ansible.builtin.command: df -h /
      register: health_df
      changed_when: false

    - name: Check docker is available
      ansible.builtin.shell: command -v docker
      args:
        executable: /bin/bash
      register: health_docker
      changed_when: false
      failed_when: false

    - name: List docker containers
      ansible.builtin.command: docker ps --format json
      register: health_ps
      changed_when: false
      failed_when: false
      when: health_docker.rc == 0

    - name: Check fail2ban state
      ansible.builtin.command: systemctl is-active fail2ban
      register: health_f2b
      changed_when: false
      failed_when: false

    - name: Check crowdsec agent answers LAPI
      ansible.builtin.command: docker exec crowdsec-agent cscli lapi status
      register: health_cs
      changed_when: false
      failed_when: false
      when: health_docker.rc == 0

    - name: Inspect remnawave agent container
      ansible.builtin.command: docker inspect remnanode
      register: health_remna
      changed_when: false
      failed_when: false
      when: health_docker.rc == 0

    - name: Build health summary
      ansible.builtin.set_fact:
        health_summary: "uptime={{ health_uptime_h }}h load={{ health_load }} mem={{ health_mem }} disk={{ health_disk }} containers={{ health_n }} fail2ban={{ health_f2b_state }} crowdsec={{ health_cs_state }} remnanode={{ health_remna_state }}"
      vars:
        health_uptime_h: "{{ ansible_facts.uptime_seconds | int // 3600 }}"
        health_load: "{{ ansible_facts.load_avg_1m | default('n/a') }}"
        health_mem_t: "{{ ansible_facts.memory_mb.real.total | default(0) }}"
        health_mem_u: "{{ ansible_facts.memory_mb.real.used | default(0) }}"
        health_mem: "{{ '%s/%sMB(%s%%)' % (health_mem_u, health_mem_t, ((health_mem_u | int / health_mem_t | int * 100) | round | int)) if (health_mem_t | int > 0) else 'n/a' }}"
        health_disk: "{{ ((health_df.stdout_lines | last).split()[4]) if (health_df.stdout_lines | default([]) | length > 1) else 'n/a' }}"
        health_n: "{{ health_ps.stdout_lines | default([]) | length if (health_docker.rc == 0) else 'n/a' }}"
        health_f2b_state: "{{ 'active' if (health_f2b.stdout | default('') | trim == 'active') else ('missing' if 'could not be found' in (health_f2b.stderr | default('')) else 'inactive') }}"
        health_cs_state: "{{ 'n/a' if (health_docker.rc != 0) else ('ok' if (health_cs.rc | default(1) | int == 0) else ('na' if 'No such container' in ((health_cs.stdout | default('')) + (health_cs.stderr | default(''))) else 'fail')) }}"
        health_remna_state: "{{ 'n/a' if (health_docker.rc != 0) else ('na' if (health_remna.rc | default(1) | int != 0) else ('up' if '\"Status\": \"running\"' in (health_remna.stdout | default('')) else 'stopped')) }}"

    - name: Show health summary
      ansible.builtin.debug:
        var: health_summary

    - name: Show docker containers
      ansible.builtin.debug:
        var: health_ps.stdout_lines
      when:
        - health_docker.rc == 0
        - health_ps.stdout_lines | default([]) | length > 0
