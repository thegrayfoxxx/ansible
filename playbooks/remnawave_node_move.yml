---
- name: Remnawave node move — discover source
  hosts: "{{ target }}"
  gather_facts: false
  become: true
  vars:
    remnanode_move_action: inspect
    remnanode_move_scope: local
    remnanode_move_dest: ""
    remnanode_move_confirmed: false
    remnanode_move_purge_backup: true
    remnanode_dir: /opt/remnanode
    remnanode_old_dir: ""
    remnanode_agent_container: remnanode
    remnanode_require_discovered_old_dir: true
  tasks:
    - name: Validate move action
      ansible.builtin.fail:
        msg: "remnanode_move_action must be inspect or move, got '{{ remnanode_move_action }}'"
      when: remnanode_move_action not in ['inspect', 'move']

    - name: Validate move scope
      ansible.builtin.fail:
        msg: "remnanode_move_scope must be local or remote, got '{{ remnanode_move_scope }}'"
      when: remnanode_move_scope not in ['local', 'remote']

    - name: Require exactly one source host
      ansible.builtin.fail:
        msg: "Move reads from one source node per run — point target at a single source host, got {{ ansible_play_hosts_all | length }}"
      when: ansible_play_hosts_all | length != 1

    - name: Require destination host for remote move
      ansible.builtin.fail:
        msg: "Set remnanode_move_dest to the destination inventory hostname (e.g. de9)"
      when:
        - remnanode_move_scope == 'remote'
        - remnanode_move_dest | default('', true) | trim | length == 0

    - name: Require destination different from source
      ansible.builtin.fail:
        msg: "Destination '{{ remnanode_move_dest | trim }}' is the source host itself. Remote move needs two different nodes"
      when:
        - remnanode_move_scope == 'remote'
        - (remnanode_move_dest | trim) == inventory_hostname

    - name: Require move confirmation
      ansible.builtin.fail:
        msg: "Move stops and renames the working node {{ inventory_hostname }}. Set remnanode_move_confirmed=true to allow"
      when:
        - remnanode_move_action == 'move'
        - not (remnanode_move_confirmed | bool)

    - name: Check Debian family on source
      ansible.builtin.stat:
        path: /etc/debian_version
      register: remnanode_src_debian

    - name: Require Debian or Ubuntu on source
      ansible.builtin.fail:
        msg: "Remnawave node needs Debian or Ubuntu"
      when: not remnanode_src_debian.stat.exists

    - name: Normalize node settings
      ansible.builtin.include_role:
        name: remnanode
        tasks_from: normalize

    - name: Discover source state
      ansible.builtin.include_role:
        name: remnanode
        tasks_from: discover

    - name: Require source container
      ansible.builtin.fail:
        msg: "Container '{{ remnanode_agent_container }}' not found on {{ inventory_hostname }}. Set remnanode_agent_container or remnanode_old_dir explicitly"
      when: not (remnanode_container_exists | bool)

    - name: Warn about unmanaged geodata mounts
      ansible.builtin.debug:
        msg: >-
          Unmanaged mounts under /usr/local/share/xray were found:
          {{ remnanode_geo_foreign_mounts | map(attribute='Destination') | join(', ') }}.
          move only preserves files in {{ remnanode_geo_source_dir }}.
      when: remnanode_geo_foreign_mounts | length > 0

    - name: Warn about an unmanaged zapret mount
      ansible.builtin.debug:
        msg: >-
          zapret.dat is mounted from {{ remnanode_zapret_mount_source_current }}
          outside {{ remnanode_geo_source_dir }}; move only preserves the managed path.
      when: remnanode_zapret_foreign | bool

    - name: Refuse to move unmanaged geodata mounts
      ansible.builtin.fail:
        msg: >-
          The source stack has unmanaged mounts under /usr/local/share/xray or
          /usr/local/bin/zapret.dat. move preserves only files in
          {{ remnanode_geo_source_dir }}. Move the files there and re-run.
      when:
        - remnanode_move_action == 'move'
        - (remnanode_geo_foreign_mounts | length > 0) or (remnanode_zapret_foreign | bool)

    - name: Require source credentials
      ansible.builtin.set_fact:
        remnanode_require_credentials: true

    - name: Discover source credentials
      ansible.builtin.include_role:
        name: remnanode
        tasks_from: credentials

    - name: Check source firewall state
      ansible.builtin.include_role:
        name: remnanode
        tasks_from: ufw_check

    - name: Resolve move payload
      ansible.builtin.set_fact:
        remnanode_move_payload:
          port: "{{ remnanode_port_final }}"
          secret: "{{ remnanode_node_secret }}"
          image: "{{ remnanode_image_current }}"
          mount_shm: "{{ remnanode_existing_mount_shm | bool }}"
          mount_logs: "{{ remnanode_existing_mount_logs | bool }}"
          log_dir: "{{ remnanode_log_dir_current if (remnanode_log_dir_current | length > 0) else '/var/log/remnanode' }}"
          log_max_size: "{{ remnanode_log_max_size_current if (remnanode_log_max_size_current | length > 0) else '100M' }}"
          log_keep: "{{ remnanode_log_keep_current if (remnanode_log_keep_current | length > 0) else '5' }}"
          xray_custom: "{{ remnanode_existing_mount_xray | bool }}"
          xray_version: "{{ remnanode_old_xray_version | default('') }}"
          geo_files: "{{ remnanode_geo_files_current }}"
          geo_dir: "{{ remnanode_geo_source_dir }}"
          zapret: "{{ remnanode_zapret_current | bool }}"
          arch: "{{ remnanode_host_arch }}"
          arch_asset: "{{ remnanode_host_arch_asset }}"
          source_host: "{{ inventory_hostname }}"
          source_container: "{{ remnanode_agent_container }}"
          source_dir: "{{ remnanode_old_dir_final }}"
      no_log: true

    - name: Require a source image
      ansible.builtin.fail:
        msg: "Cannot determine the current image of '{{ remnanode_agent_container }}'"
      when: remnanode_move_payload.image | default('') | trim | length == 0

    - name: Stat source geodata files
      ansible.builtin.stat:
        path: "{{ remnanode_move_payload.geo_dir }}/{{ item }}"
      loop: "{{ remnanode_move_payload.geo_files | default([]) }}"
      register: remnanode_move_geo_stat
      when: remnanode_move_action == 'move'

    - name: Require source geodata files
      ansible.builtin.fail:
        msg: >-
          Geodata file '{{ item.item }}' is mounted but missing or not a
          regular file at {{ remnanode_move_payload.geo_dir }}/{{ item.item }}.
          Restore it before moving.
      loop: "{{ remnanode_move_geo_stat.results | default([]) }}"
      when:
        - remnanode_move_action == 'move'
        - not (item.stat.exists | default(false)) or not (item.stat.isreg | default(false))

    - name: Stat source zapret file
      ansible.builtin.stat:
        path: "{{ remnanode_move_payload.geo_dir }}/zapret.dat"
      register: remnanode_move_zapret_stat
      when:
        - remnanode_move_action == 'move'
        - remnanode_move_payload.zapret | bool

    - name: Resolve source zapret presence
      ansible.builtin.set_fact:
        remnanode_move_zapret_exists: >-
          {{ (remnanode_move_zapret_stat.stat.exists | default(false))
             if (remnanode_move_action == 'move' and remnanode_move_payload.zapret | bool) else false }}

    - name: Require source zapret file
      ansible.builtin.fail:
        msg: >-
          zapret.dat is mounted but missing at
          {{ remnanode_move_payload.geo_dir }}/zapret.dat. Restore it before moving.
      when:
        - remnanode_move_action == 'move'
        - remnanode_move_payload.zapret | bool
        - not (remnanode_move_zapret_exists | bool)

    - name: Show source discovery
      ansible.builtin.debug:
        msg: "source={{ inventory_hostname }} container={{ remnanode_agent_container }} dir={{ remnanode_old_dir_final }} image={{ remnanode_move_payload.image }} port={{ remnanode_move_payload.port }} creds_from={{ remnanode_creds_source }} shm={{ remnanode_move_payload.mount_shm }} logs={{ remnanode_move_payload.mount_logs }} log_dir={{ remnanode_move_payload.log_dir }} log_size={{ remnanode_move_payload.log_max_size }} log_keep={{ remnanode_move_payload.log_keep }} geo={{ remnanode_move_payload.geo_files | join(',') or '(none)' }} zapret={{ remnanode_move_payload.zapret }} xray={{ 'custom ' + remnanode_move_payload.xray_version if (remnanode_move_payload.xray_custom | bool) else 'image' }} arch={{ remnanode_move_payload.arch }} scope={{ remnanode_move_scope }}"

    - name: Stop at inspect
      ansible.builtin.meta: end_play
      when: remnanode_move_action == 'inspect'

    - name: Move the stack locally
      when: remnanode_move_scope == 'local'
      block:
        - name: Resolve normalized source and target dirs
          ansible.builtin.set_fact:
            remnanode_move_source_dir_norm: "{{ remnanode_old_dir_final | regex_replace('/+$', '') }}"
            remnanode_move_target_dir_norm: "{{ remnanode_dir | regex_replace('/+$', '') }}"

        - name: Refuse same-dir move
          ansible.builtin.fail:
            msg: "Stack already lives in {{ remnanode_dir }} — this is not a move. Use remnawave_node_config for host config or remnawave_node_deploy remnanode_force=true to re-render in place"
          when: remnanode_move_source_dir_norm == remnanode_move_target_dir_norm

        - name: Refuse overlapping source and target dirs
          ansible.builtin.fail:
            msg: "Source {{ remnanode_move_source_dir_norm }} and target {{ remnanode_move_target_dir_norm }} overlap. Choose a target outside the source tree"
          when: >-
            remnanode_move_target_dir_norm.startswith(remnanode_move_source_dir_norm + '/')
            or remnanode_move_source_dir_norm.startswith(remnanode_move_target_dir_norm + '/')

        - name: Refuse an existing target dir
          ansible.builtin.fail:
            msg: "Target dir {{ remnanode_dir }} already exists. Local move needs a clean target; remove it, choose another remnanode_dir, or use remnawave_node_deploy remnanode_force=true if the stack is meant to stay there"
          when: remnanode_target_dir_exists | bool

        - name: Timestamp for backup
          ansible.builtin.command: date +%Y%m%d%H%M%S
          register: remnanode_move_ts
          changed_when: false

        - name: Resolve local backup names
          ansible.builtin.set_fact:
            remnanode_move_backup_dir: "{{ remnanode_move_source_dir_norm }}.move-bak-{{ remnanode_move_ts.stdout | trim }}"
            remnanode_move_backup_container: "{{ remnanode_agent_container }}-move-bak-{{ remnanode_move_ts.stdout | trim }}"
            remnanode_move_xray_tmp: "/tmp/remnanode-xray-move-{{ remnanode_move_ts.stdout | trim }}"

        - name: Check source dir exists
          ansible.builtin.stat:
            path: "{{ remnanode_move_source_dir_norm }}"
          register: remnanode_move_source_stat

        - name: Check local backup dir is free
          ansible.builtin.stat:
            path: "{{ remnanode_move_backup_dir }}"
          register: remnanode_move_backup_check
          when: remnanode_move_source_stat.stat.exists

        - name: Refuse occupied local backup dir
          ansible.builtin.fail:
            msg: "Backup path {{ remnanode_move_backup_dir }} already exists. Inspect it manually and re-run"
          when:
            - remnanode_move_source_stat.stat.exists
            - remnanode_move_backup_check.stat.exists

        - name: Move the stack on the same host
          block:
            - name: Extract custom xray from source container
              ansible.builtin.command:
                argv: ["docker", "cp", "{{ remnanode_agent_container }}:/usr/local/bin/xray", "{{ remnanode_move_xray_tmp }}"]
              changed_when: false
              when: remnanode_move_payload.xray_custom | bool

            - name: Stop old container
              ansible.builtin.command:
                argv: ["docker", "stop", "{{ remnanode_agent_container }}"]
              changed_when: true

            - name: Rename old container aside
              ansible.builtin.command:
                argv: ["docker", "rename", "{{ remnanode_agent_container }}", "{{ remnanode_move_backup_container }}"]
              changed_when: true

            - name: Move old project dir aside
              ansible.builtin.command:
                argv: ["mv", "{{ remnanode_move_source_dir_norm }}", "{{ remnanode_move_backup_dir }}"]
              changed_when: true
              when: remnanode_move_source_stat.stat.exists

            - name: Create target project dir
              ansible.builtin.file:
                path: "{{ remnanode_dir }}"
                state: directory
                mode: "0755"

            - name: Check source geodata directory
              ansible.builtin.stat:
                path: "{{ remnanode_move_backup_dir }}/xray/share"
              register: remnanode_move_geo_dir_stat

            - name: Create target geodata directory
              ansible.builtin.file:
                path: "{{ remnanode_dir }}/xray/share"
                state: directory
                mode: "0755"
              when: remnanode_move_geo_dir_stat.stat.exists | bool

            - name: Preserve geodata files
              ansible.builtin.copy:
                src: "{{ remnanode_move_backup_dir }}/xray/share/"
                dest: "{{ remnanode_dir }}/xray/share/"
                remote_src: true
                mode: preserve
              when: remnanode_move_geo_dir_stat.stat.exists | bool

            - name: Install preserved xray binary
              ansible.builtin.copy:
                src: "{{ remnanode_move_xray_tmp }}"
                dest: "{{ remnanode_dir }}/xray-core"
                remote_src: true
                mode: "0755"
              when: remnanode_move_payload.xray_custom | bool

            - name: Record preserved xray version
              ansible.builtin.copy:
                content: "{{ remnanode_move_payload.xray_version }}\n"
                dest: "{{ remnanode_dir }}/.xray-core.version"
                mode: "0644"
              when:
                - remnanode_move_payload.xray_custom | bool
                - remnanode_move_payload.xray_version | default('') | length > 0

            - name: Resolve moved stack facts
              ansible.builtin.set_fact:
                remnanode_node_image: "{{ remnanode_move_payload.image }}"
                remnanode_mount_shm: "{{ remnanode_move_payload.mount_shm | bool }}"
                remnanode_mount_logs: "{{ remnanode_move_payload.mount_logs | bool }}"
                remnanode_log_dir: "{{ remnanode_move_payload.log_dir }}"
                remnanode_log_max_size: "{{ remnanode_move_payload.log_max_size }}"
                remnanode_log_keep: "{{ remnanode_move_payload.log_keep }}"
                remnanode_mount_shm_effective: "{{ remnanode_move_payload.mount_shm | bool }}"
                remnanode_mount_logs_effective: "{{ remnanode_move_payload.mount_logs | bool }}"
                remnanode_log_dir_effective: "{{ remnanode_move_payload.log_dir }}"
                remnanode_log_max_size_effective: "{{ remnanode_move_payload.log_max_size }}"
                remnanode_log_keep_effective: "{{ remnanode_move_payload.log_keep }}"
                remnanode_geo_files_effective: "{{ remnanode_move_payload.geo_files | default([]) }}"
                remnanode_geo_files_current: "{{ remnanode_move_payload.geo_files | default([]) }}"
                remnanode_zapret_mode_norm: "{{ 'keep' if (remnanode_move_payload.zapret | bool) else 'off' }}"
                remnanode_zapret_mode_effective: "{{ 'keep' if (remnanode_move_payload.zapret | bool) else 'off' }}"
                remnanode_mount_zapret_effective: "{{ remnanode_move_payload.zapret | bool }}"
                remnanode_zapret_current: "{{ remnanode_move_payload.zapret | bool }}"
                remnanode_zapret_mount_source_current: "{{ (remnanode_geo_dir ~ '/zapret.dat') if (remnanode_move_payload.zapret | bool) else '' }}"
                remnanode_zapret_foreign: false
                remnanode_geo_foreign_mounts: []
                remnanode_port_final: "{{ remnanode_move_payload.port }}"
                remnanode_node_secret: "{{ remnanode_move_payload.secret }}"
                remnanode_xray_mode: keep
                remnanode_xray_prepared: true
                remnanode_existing_mount_xray: "{{ remnanode_move_payload.xray_custom | bool }}"
                remnanode_existing_custom_xray: "{{ remnanode_move_payload.xray_custom | bool }}"
                remnanode_target_xray_binary_exists: "{{ remnanode_move_payload.xray_custom | bool }}"
                remnanode_target_xray_marker_exists: "{{ (remnanode_move_payload.xray_custom | bool) and (remnanode_move_payload.xray_version | default('') | length > 0) }}"
                remnanode_xray_version_current: "{{ remnanode_move_payload.xray_version | default('') }}"
              no_log: true

            - name: Resolve xray intent for the moved stack
              ansible.builtin.include_role:
                name: remnanode
                tasks_from: xray

            - name: Validate moved geodata files
              ansible.builtin.include_role:
                name: remnanode
                tasks_from: geo

            - name: Render moved stack files
              ansible.builtin.include_role:
                name: remnanode
                tasks_from: render

            - name: Start the moved stack
              ansible.builtin.include_role:
                name: remnanode
                tasks_from: up

            - name: Show local move summary
              ansible.builtin.debug:
                msg: "moved {{ remnanode_move_source_dir_norm }} -> {{ remnanode_dir }} container={{ remnanode_agent_container }} port={{ remnanode_port_final }} image={{ remnanode_node_image }} geo={{ remnanode_geo_files_effective | join(',') or '(none)' }} zapret={{ remnanode_mount_zapret_effective }} xray={{ remnanode_xray_summary }} backup_container={{ remnanode_move_backup_container }}{{ (' backup_dir=' + remnanode_move_backup_dir) if remnanode_move_source_stat.stat.exists else '' }}{{ ' (backup auto-purged after verify)' if (remnanode_move_purge_backup | bool and remnanode_move_source_stat.stat.exists | bool) else ' (backup kept, purge manually when stable)' }}"

            - name: Purge moved stack backup container after successful move
              ansible.builtin.command:
                argv: ["docker", "rm", "-f", "{{ remnanode_move_backup_container }}"]
              changed_when: true
              when:
                - remnanode_move_source_stat.stat.exists | bool
                - remnanode_move_purge_backup | bool

            - name: Purge moved stack backup dir after successful move
              ansible.builtin.file:
                path: "{{ remnanode_move_backup_dir }}"
                state: absent
              when:
                - remnanode_move_source_stat.stat.exists | bool
                - remnanode_move_purge_backup | bool
          rescue:
            - name: Remove preserved xray temp
              ansible.builtin.file:
                path: "{{ remnanode_move_xray_tmp | default('/nonexistent-remnanode-move-temp') }}"
                state: absent
              failed_when: false

            - name: Take down partial moved stack
              community.docker.docker_compose_v2:
                project_src: "{{ remnanode_dir | default('/opt/remnanode') }}"
                state: absent
              failed_when: false

            - name: Remove partial target dir
              ansible.builtin.file:
                path: "{{ remnanode_dir | default('/opt/remnanode') }}"
                state: absent
              failed_when: false

            - name: Restore old project dir
              ansible.builtin.command:
                argv: ["mv", "{{ remnanode_move_backup_dir | default('/nonexistent-remnanode-move-backup') }}", "{{ remnanode_move_source_dir_norm | default('/nonexistent-remnanode-source') }}"]
              changed_when: true
              failed_when: false
              when:
                - remnanode_move_backup_dir is defined
                - remnanode_move_source_stat.stat.exists | default(false)

            - name: Restore old container name
              ansible.builtin.command:
                argv: ["docker", "rename", "{{ remnanode_move_backup_container | default('nonexistent-remnanode-move-backup') }}", "{{ remnanode_agent_container | default('remnanode') }}"]
              changed_when: true
              failed_when: false
              when: remnanode_move_backup_container is defined

            - name: Start old container
              ansible.builtin.command:
                argv: ["docker", "start", "{{ remnanode_agent_container | default('remnanode') }}"]
              changed_when: true
              failed_when: false

            - name: Fail with local rollback note
              ansible.builtin.fail:
                msg: "Local move failed ({{ ansible_failed_result.msg | default('see above') }}); rollback attempted — verify source container '{{ remnanode_agent_container }}' and dir {{ remnanode_old_dir_final }} manually"

        - name: Stop after local move
          ansible.builtin.meta: end_play
          when: remnanode_move_scope == 'local'

    - name: Publish remote move payload
      ansible.builtin.set_fact:
        remnanode_move_published: "{{ remnanode_move_payload }}"
        remnawave_move_ok: false
      delegate_to: localhost
      delegate_facts: true
      no_log: true
      when: remnanode_move_scope == 'remote'

    - name: Show remote preflight result
      ansible.builtin.debug:
        msg: "source preflight OK — destination={{ remnanode_move_dest | trim }}; source stays untouched until the destination is verified"
      when: remnanode_move_scope == 'remote'

- name: Remnawave node move — deploy on destination
  hosts: "{{ remnanode_move_dest | default('localhost', true) }}"
  gather_facts: false
  become: true
  vars:
    remnanode_move_action: inspect
    remnanode_move_scope: local
    remnanode_move_dest: ""
    remnanode_dir: /opt/remnanode
    remnanode_old_dir: ""
    remnanode_agent_container: remnanode
  tasks:
    - name: Stop when this is not a remote move
      ansible.builtin.meta: end_play
      when: (remnanode_move_scope != 'remote') or (remnanode_move_action != 'move')

    - name: Require destination host value
      ansible.builtin.fail:
        msg: "Set remnanode_move_dest to the destination inventory hostname"
      when: remnanode_move_dest | default('', true) | trim | length == 0

    - name: Require exactly one destination host
      ansible.builtin.fail:
        msg: "Move deploys to one destination node per run — point remnanode_move_dest at a single inventory hostname, got {{ ansible_play_hosts_all | length }}"
      when: ansible_play_hosts_all | length != 1

    - name: Load remote move payload
      ansible.builtin.set_fact:
        remnanode_move_payload: "{{ hostvars['localhost']['remnanode_move_published'] }}"
      no_log: true

    - name: Require destination different from source
      ansible.builtin.fail:
        msg: "Destination '{{ inventory_hostname }}' is the source host itself"
      when: inventory_hostname == remnanode_move_payload.source_host

    - name: Check Debian family on destination
      ansible.builtin.stat:
        path: /etc/debian_version
      register: remnanode_dest_debian

    - name: Require Debian or Ubuntu on destination
      ansible.builtin.fail:
        msg: "Remnawave node needs Debian or Ubuntu"
      when: not remnanode_dest_debian.stat.exists

    - name: Normalize destination settings
      ansible.builtin.include_role:
        name: remnanode
        tasks_from: normalize

    - name: Discover destination state
      ansible.builtin.include_role:
        name: remnanode
        tasks_from: discover

    - name: Refuse an existing destination dir
      ansible.builtin.fail:
        msg: "Target dir {{ remnanode_dir }} already exists on {{ inventory_hostname }}. Remote move needs a clean target; remove it or choose another remnanode_dir"
      when: remnanode_target_dir_exists | bool

    - name: Refuse an occupied destination container name
      ansible.builtin.fail:
        msg: "Destination already has a container named '{{ remnanode_agent_container }}'. Move needs a clean destination"
      when: remnanode_container_exists | bool

    - name: Check destination port is free
      ansible.builtin.shell: "ss -tlnp | grep -E ':{{ remnanode_move_payload.port }}\\s' || true"
      args:
        executable: /bin/bash
      register: remnanode_move_dest_port_busy
      changed_when: false
      failed_when: false

    - name: Refuse busy destination port
      ansible.builtin.fail:
        msg: "Port {{ remnanode_move_payload.port }} is already listening on destination. Move needs it free"
      when: remnanode_move_dest_port_busy.stdout | length > 0

    - name: Refuse custom xray across architectures
      ansible.builtin.fail:
        msg: "Source custom xray is built for '{{ remnanode_move_payload.arch }}' ({{ remnanode_move_payload.arch_asset | default('unknown', true) }}) but destination is '{{ remnanode_host_arch }}' ({{ remnanode_host_arch_asset | default('unknown', true) }}). On the source run remnawave_node_config action=apply remnanode_xray_mode=image, then move, then install the desired version on the destination with remnawave_node_config remnanode_xray_mode=version"
      when:
        - remnanode_move_payload.xray_custom | bool
        - >-
          (((remnanode_move_payload.arch_asset | default('', true) | length > 0)
            and (remnanode_host_arch_asset | default('', true) | length > 0))
           and (remnanode_move_payload.arch_asset != remnanode_host_arch_asset))
          or ((((remnanode_move_payload.arch_asset | default('', true) | length == 0)
                or (remnanode_host_arch_asset | default('', true) | length == 0))
               and (remnanode_move_payload.arch != remnanode_host_arch)))

    - name: Prepare and start the moved stack
      block:
        - name: Ensure destination project dir
          ansible.builtin.file:
            path: "{{ remnanode_dir }}"
            state: directory
            mode: "0755"

        - name: Resolve geodata files to fetch
          ansible.builtin.set_fact:
            remnanode_move_geo_fetch: >-
              {{ ((remnanode_move_payload.geo_files | default([]))
                  + (['zapret.dat'] if (remnanode_move_payload.zapret | bool) else []))
                 | unique | sort }}

        - name: Move geodata files to destination
          block:
            - name: Create destination geodata dir
              ansible.builtin.file:
                path: "{{ remnanode_geo_dir }}"
                state: directory
                mode: "0755"
              when: remnanode_move_geo_fetch | length > 0

            - name: Fetch geodata files from source
              ansible.builtin.fetch:
                src: "{{ remnanode_move_payload.geo_dir }}/{{ item }}"
                dest: "/tmp/remnanode-move-geo-{{ inventory_hostname }}/"
                flat: true
              delegate_to: "{{ remnanode_move_payload.source_host }}"
              loop: "{{ remnanode_move_geo_fetch }}"
              when: remnanode_move_geo_fetch | length > 0

            - name: Install fetched geodata files
              ansible.builtin.copy:
                src: "/tmp/remnanode-move-geo-{{ inventory_hostname }}/{{ item }}"
                dest: "{{ remnanode_geo_dir }}/{{ item }}"
                mode: "0644"
              loop: "{{ remnanode_move_geo_fetch }}"
              when: remnanode_move_geo_fetch | length > 0
          always:
            - name: Remove fetched geodata files
              ansible.builtin.file:
                path: "/tmp/remnanode-move-geo-{{ inventory_hostname }}"
                state: absent
              delegate_to: localhost
              become: false

        - name: Preserve custom xray from source
          block:
            - name: Extract custom xray from source container
              ansible.builtin.command:
                argv: ["docker", "cp", "{{ remnanode_move_payload.source_container }}:/usr/local/bin/xray", "/tmp/remnanode-xray-move-{{ inventory_hostname }}"]
              delegate_to: "{{ remnanode_move_payload.source_host }}"
              changed_when: false

            - name: Fetch custom xray binary from source
              ansible.builtin.fetch:
                src: "/tmp/remnanode-xray-move-{{ inventory_hostname }}"
                dest: "/tmp/remnanode-xray-move-{{ inventory_hostname }}.bin"
                flat: true
              delegate_to: "{{ remnanode_move_payload.source_host }}"

            - name: Install custom xray binary on destination
              ansible.builtin.copy:
                src: "/tmp/remnanode-xray-move-{{ inventory_hostname }}.bin"
                dest: "{{ remnanode_dir }}/xray-core"
                mode: "0755"
          always:
            - name: Remove fetched xray binary
              ansible.builtin.file:
                path: "/tmp/remnanode-xray-move-{{ inventory_hostname }}.bin"
                state: absent
              delegate_to: localhost
              become: false

            - name: Remove source xray temp
              ansible.builtin.file:
                path: "/tmp/remnanode-xray-move-{{ inventory_hostname }}"
                state: absent
              delegate_to: "{{ remnanode_move_payload.source_host }}"
              failed_when: false
          when: remnanode_move_payload.xray_custom | bool

        - name: Record preserved xray version on destination
          ansible.builtin.copy:
            content: "{{ remnanode_move_payload.xray_version }}\n"
            dest: "{{ remnanode_dir }}/.xray-core.version"
            mode: "0644"
          when:
            - remnanode_move_payload.xray_custom | bool
            - remnanode_move_payload.xray_version | default('') | length > 0

        - name: Resolve moved stack facts
          ansible.builtin.set_fact:
            remnanode_node_image: "{{ remnanode_move_payload.image }}"
            remnanode_mount_shm: "{{ remnanode_move_payload.mount_shm | bool }}"
            remnanode_mount_logs: "{{ remnanode_move_payload.mount_logs | bool }}"
            remnanode_log_dir: "{{ remnanode_move_payload.log_dir }}"
            remnanode_log_max_size: "{{ remnanode_move_payload.log_max_size }}"
            remnanode_log_keep: "{{ remnanode_move_payload.log_keep }}"
            remnanode_mount_shm_effective: "{{ remnanode_move_payload.mount_shm | bool }}"
            remnanode_mount_logs_effective: "{{ remnanode_move_payload.mount_logs | bool }}"
            remnanode_log_dir_effective: "{{ remnanode_move_payload.log_dir }}"
            remnanode_log_max_size_effective: "{{ remnanode_move_payload.log_max_size }}"
            remnanode_log_keep_effective: "{{ remnanode_move_payload.log_keep }}"
            remnanode_geo_files_effective: "{{ remnanode_move_payload.geo_files | default([]) }}"
            remnanode_geo_files_current: "{{ remnanode_move_payload.geo_files | default([]) }}"
            remnanode_zapret_mode_norm: "{{ 'keep' if (remnanode_move_payload.zapret | bool) else 'off' }}"
            remnanode_zapret_mode_effective: "{{ 'keep' if (remnanode_move_payload.zapret | bool) else 'off' }}"
            remnanode_mount_zapret_effective: "{{ remnanode_move_payload.zapret | bool }}"
            remnanode_zapret_current: "{{ remnanode_move_payload.zapret | bool }}"
            remnanode_zapret_mount_source_current: "{{ (remnanode_geo_dir ~ '/zapret.dat') if (remnanode_move_payload.zapret | bool) else '' }}"
            remnanode_zapret_foreign: false
            remnanode_geo_foreign_mounts: []
            remnanode_port_final: "{{ remnanode_move_payload.port }}"
            remnanode_node_secret: "{{ remnanode_move_payload.secret }}"
            remnanode_xray_mode: keep
            remnanode_xray_prepared: true
            remnanode_existing_mount_xray: "{{ remnanode_move_payload.xray_custom | bool }}"
            remnanode_existing_custom_xray: "{{ remnanode_move_payload.xray_custom | bool }}"
            remnanode_target_xray_binary_exists: "{{ remnanode_move_payload.xray_custom | bool }}"
            remnanode_target_xray_marker_exists: "{{ (remnanode_move_payload.xray_custom | bool) and (remnanode_move_payload.xray_version | default('') | length > 0) }}"
            remnanode_xray_version_current: "{{ remnanode_move_payload.xray_version | default('') }}"
          no_log: true

        - name: Resolve xray intent for the moved stack
          ansible.builtin.include_role:
            name: remnanode
            tasks_from: xray

        - name: Validate moved geodata files
          ansible.builtin.include_role:
            name: remnanode
            tasks_from: geo

        - name: Render moved stack files
          ansible.builtin.include_role:
            name: remnanode
            tasks_from: render

        - name: Start moved stack
          ansible.builtin.include_role:
            name: remnanode
            tasks_from: up

        - name: Mark remote move verified
          ansible.builtin.set_fact:
            remnawave_move_ok: true
          delegate_to: localhost
          delegate_facts: true

        - name: Show remote move summary
          ansible.builtin.debug:
            msg: "moved {{ remnanode_move_payload.source_host }} -> {{ inventory_hostname }}:{{ remnanode_dir }} port={{ remnanode_port_final }} image={{ remnanode_node_image }} geo={{ remnanode_geo_files_effective | join(',') or '(none)' }} zapret={{ remnanode_mount_zapret_effective }} xray={{ remnanode_xray_summary }} ufw={{ remnanode_ufw_state }} port_fw={{ remnanode_port_fw }} (repoint DNS manually; source is decommissioned only after this verification)"
      rescue:
        - name: Take down partial moved stack
          community.docker.docker_compose_v2:
            project_src: "{{ remnanode_dir }}"
            state: absent
          failed_when: false

        - name: Remove partial target dir
          ansible.builtin.file:
            path: "{{ remnanode_dir }}"
            state: absent
          failed_when: false

        - name: Fail with source intact note
          ansible.builtin.fail:
            msg: "Remote move failed ({{ ansible_failed_result.msg | default('see above') }}); source {{ remnanode_move_payload.source_host }} is untouched — fix and re-run"

- name: Remnawave node move — decommission source
  hosts: "{{ target }}"
  gather_facts: false
  become: true
  vars:
    remnanode_move_action: inspect
    remnanode_move_scope: local
    remnanode_agent_container: remnanode
  tasks:
    - name: Stop when this is not a verified remote move
      ansible.builtin.meta: end_play
      when: >-
        (remnanode_move_scope != 'remote')
        or (remnanode_move_action != 'move')
        or not (hostvars['localhost']['remnawave_move_ok'] | default(false) | bool)

    - name: Timestamp for backup
      ansible.builtin.command: date +%Y%m%d%H%M%S
      register: remnanode_move_ts
      changed_when: false

    - name: Stop old container
      ansible.builtin.command:
        argv: ["docker", "stop", "{{ remnanode_agent_container }}"]
      register: remnanode_old_stop
      changed_when: true
      failed_when: false

    - name: Require stopped old container
      ansible.builtin.fail:
        msg: "Could not stop old container '{{ remnanode_agent_container }}' on source (rc={{ remnanode_old_stop.rc }}). New node is UP with the same identity — stop the old one MANUALLY NOW to avoid flapping: docker stop {{ remnanode_agent_container }}"
      when: remnanode_old_stop.rc != 0

    - name: Rename old container aside
      ansible.builtin.command:
        argv: ["docker", "rename", "{{ remnanode_agent_container }}", "{{ remnanode_agent_container }}-moved-bak-{{ remnanode_move_ts.stdout | trim }}"]
      changed_when: true

    - name: Purge moved source backup after successful move
      when: remnanode_move_action == 'move'
      block:
        - name: Remove moved source backup container
          ansible.builtin.command:
            argv: ["docker", "rm", "-f", "{{ remnanode_agent_container }}-moved-bak-{{ remnanode_move_ts.stdout | trim }}"]
          changed_when: true

        - name: Remove moved source backup dir
          ansible.builtin.file:
            path: "{{ remnanode_old_dir_final }}.move-bak-{{ remnanode_move_ts.stdout | trim }}"
            state: absent

    - name: Show decommission summary
      ansible.builtin.debug:
        msg: "source {{ inventory_hostname }} decommissioned: moved-source backup container {{ remnanode_agent_container }}-moved-bak-{{ remnanode_move_ts.stdout | trim }} renamed aside then purged after successful move, project files left intact (remove manually when stable). Repoint DNS to the new node (mind TTL)"
