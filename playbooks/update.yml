---
- name: Update Debian packages
  hosts: "{{ target }}"
  gather_facts: true
  become: true
  vars:
    apt_upgrade: dist
    apt_autoremove: true
    apt_autoclean: true
    reboot_if_required: false
    update_confirmed: false
    # Сколько секунд ждать dpkg lock (unattended-upgrades на свежей ноде).
    apt_lock_timeout: 600
  tasks:
    - name: Require confirmation for fleet auto-reboot
      ansible.builtin.fail:
        msg: "Auto-reboot on {{ ansible_play_hosts_all | length }} hosts needs update_confirmed=true. Set it in survey (or set reboot_if_required=false, or narrow target/Limit to one host)"
      when:
        - reboot_if_required | bool
        - ansible_play_hosts_all | length > 1
        - not (update_confirmed | bool)

    - name: Apt update
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: "{{ apt_lock_timeout | int }}"

    - name: Wait for dpkg lock (unattended-upgrades)
      ansible.builtin.shell: |
        for i in $(seq 1 {{ (apt_lock_timeout | int / 5) | int }}); do
          fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1 || exit 0
          sleep 5
        done
        echo "dpkg lock still held after {{ apt_lock_timeout }}s" >&2
        exit 1
      args:
        executable: /bin/bash
      changed_when: false

    - name: Recover interrupted dpkg
      ansible.builtin.command: dpkg --configure -a
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: dpkg_fix
      changed_when: dpkg_fix.stdout | length > 0 or dpkg_fix.stderr | length > 0

    - name: Apt upgrade
      ansible.builtin.apt:
        upgrade: "{{ apt_upgrade }}"
        lock_timeout: "{{ apt_lock_timeout | int }}"
      register: apt_result

    - name: Autoremove
      ansible.builtin.apt:
        autoremove: true
      when: apt_autoremove | bool

    - name: Autoclean
      ansible.builtin.apt:
        autoclean: true
      when: apt_autoclean | bool

    - name: Check reboot required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    # По одному хосту, чтобы не перезагрузить весь флот одновременно.
    - name: Reboot if required
      ansible.builtin.reboot:
      throttle: 1
      when:
        - reboot_if_required | bool
        - reboot_required.stat.exists
