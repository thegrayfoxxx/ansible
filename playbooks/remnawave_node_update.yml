---
- name: Remnawave node update (pull + down + up)
  hosts: "{{ target }}"
  gather_facts: false
  become: true
  vars:
    remnanode_dir: /opt/remnanode
  tasks:
    - name: Normalize project dir
      ansible.builtin.set_fact:
        remnanode_dir: "{{ (remnanode_dir | default('') | trim) or '/opt/remnanode' }}"

    - name: Validate project dir
      ansible.builtin.fail:
        msg: "remnanode_dir must be an absolute path, got '{{ remnanode_dir }}'"
      when: not (remnanode_dir is match('^/.+'))

    - name: Check docker is available
      ansible.builtin.shell: command -v docker
      args:
        executable: /bin/bash
      register: remnawave_docker_bin
      changed_when: false
      failed_when: false

    - name: Require docker on node
      ansible.builtin.fail:
        msg: "docker not found. Run the docker template on this host first"
      when: remnawave_docker_bin.rc != 0

    - name: Check compose file exists
      ansible.builtin.stat:
        path: "{{ remnanode_dir }}/compose.yml"
      register: remnawave_compose

    - name: Require deployed stack
      ansible.builtin.fail:
        msg: "No compose.yml in {{ remnanode_dir }}. Run remnawave_node_deploy first"
      when: not remnawave_compose.stat.exists

    - name: Pull latest images
      ansible.builtin.command: docker compose pull
      args:
        chdir: "{{ remnanode_dir }}"
      register: remnawave_pull
      changed_when: "'Downloaded' in (remnawave_pull.stdout + remnawave_pull.stderr)"

    - name: Recreate stack (down, volumes kept)
      community.docker.docker_compose_v2:
        project_src: "{{ remnanode_dir }}"
        state: absent
      register: remnawave_down

    - name: Recreate stack (up -d)
      community.docker.docker_compose_v2:
        project_src: "{{ remnanode_dir }}"
        state: present
      register: remnawave_up

    - name: Show update summary
      ansible.builtin.debug:
        msg: "updated {{ remnanode_dir }} (pull changed={{ remnawave_pull.changed }})"
