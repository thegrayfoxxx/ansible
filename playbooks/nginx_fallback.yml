---
- name: Deploy nginx fallback (Selfsteal stub + LE certificate)
  hosts: "{{ target }}"
  gather_facts: false
  become: true
  vars:
    nginx_domain: ""
    nginx_email: ""
    nginx_html: ""
    nginx_dir: /opt/nginx
    nginx_staging: false
    nginx_force_issue: false
    nginx_open_ports: false
    nginx_socket: /dev/shm/nginx.sock
    nginx_web_container: fallback-web
    nginx_acme_container: fallback-acme
    # Как часто web-контейнер делает nginx -t && reload (подхват продлённого серта), секунд.
    nginx_reload_interval: 43200
  tasks:
    - name: Normalize project dir
      ansible.builtin.set_fact:
        nginx_dir: "{{ (nginx_dir | default('') | trim) or '/opt/nginx' }}"

    - name: Validate project dir
      ansible.builtin.fail:
        msg: "nginx_dir must be an absolute path, got '{{ nginx_dir }}'"
      when: not (nginx_dir is match('^/.+'))

    - name: Validate domain value
      ansible.builtin.fail:
        msg: "nginx_domain must be a plain hostname like de1.example.com (no scheme, slashes or spaces), got '{{ nginx_domain }}'"
      when: nginx_domain | default('') | trim | length == 0
        or not (nginx_domain | trim is match('^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$'))

    - name: Require fallback HTML
      ansible.builtin.fail:
        msg: "nginx_html is empty. Paste your own index.html into the survey field"
      when: nginx_html | default('') | trim | length == 0

    - name: Check Debian family
      ansible.builtin.stat:
        path: /etc/debian_version
      register: nginx_debian

    - name: Require Debian or Ubuntu
      ansible.builtin.fail:
        msg: "Nginx fallback needs Debian or Ubuntu"
      when: not nginx_debian.stat.exists

    - name: Check docker is available
      ansible.builtin.shell: command -v docker
      args:
        executable: /bin/bash
      register: nginx_docker_bin
      changed_when: false
      failed_when: false

    - name: Require docker on node
      ansible.builtin.fail:
        msg: "docker not found. Run the docker template on this host first"
      when: nginx_docker_bin.rc != 0

    - name: Check own web container is running
      ansible.builtin.command:
        argv: ["docker", "ps", "-q", "--filter", "name=^{{ nginx_web_container }}$"]
      register: nginx_own_web
      changed_when: false
      failed_when: false

    - name: Check port 80 is free for ACME http-01
      ansible.builtin.shell: "ss -tlnp | grep -E ':(80)\\s' || true"
      args:
        executable: /bin/bash
      register: nginx_port_busy
      changed_when: false
      failed_when: false

    - name: Refuse busy port 80
      ansible.builtin.fail:
        msg: "Port 80 is already listening on this host ({{ nginx_port_busy.stdout | trim }}). ACME http-01 needs it free"
      when:
        - nginx_own_web.stdout | default('') | trim | length == 0
        - nginx_port_busy.stdout | length > 0

    - name: Ensure fallback dirs
      ansible.builtin.file:
        path: "{{ nginx_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - ""
        - nginx
        - html
        - webroot
        - acme.sh
        - letsencrypt
        - "letsencrypt/live/{{ nginx_domain | trim }}"

    - name: Render compose file
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/nginx/compose.yml.j2"
        dest: "{{ nginx_dir }}/compose.yml"
        mode: "0644"
      register: nginx_compose_render

    - name: Render fallback env file
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/nginx/dotenv.j2"
        dest: "{{ nginx_dir }}/.env"
        mode: "0644"
      vars:
        nginx_acme_server: "{{ 'https://acme-staging-v02.api.letsencrypt.org/directory' if (nginx_staging | bool) else 'https://acme-v02.api.letsencrypt.org/directory' }}"

    - name: Copy nginx fallback config
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/nginx/fallback.conf.template"
        dest: "{{ nginx_dir }}/nginx/fallback.conf.template"
        mode: "0644"
      register: nginx_conf_copy

    - name: Write fallback index page
      ansible.builtin.copy:
        content: "{{ nginx_html }}"
        dest: "{{ nginx_dir }}/html/index.html"
        mode: "0644"
      register: nginx_html_copy

    - name: Prepare certificate
      ansible.builtin.include_tasks: tasks/nginx_cert_prepare.yml

    - name: Deploy fallback stack
      community.docker.docker_compose_v2:
        project_src: "{{ nginx_dir }}"
        state: present
        pull: missing
      register: nginx_deploy

    # Конфиг и index.html смонтированы файлами: после атомарной замены контейнер
    # видел старый inode, а шаблон nginx обрабатывается только при старте.
    - name: Restart web container to pick up changed config or page
      ansible.builtin.command:
        argv: ["docker", "restart", "{{ nginx_web_container }}"]
      changed_when: true
      when:
        - (nginx_conf_copy is changed) or (nginx_html_copy is changed)
        - not (nginx_deploy is changed)

    - name: Check web containers are running
      ansible.builtin.command:
        argv: ["docker", "inspect", "-f", "{{ '{{' }}.State.Running{{ '}}' }}", "{{ item }}"]
      loop:
        - "{{ nginx_web_container }}"
        - "{{ nginx_acme_container }}"
      register: nginx_running
      changed_when: false
      retries: 6
      delay: 3
      until: nginx_running.rc == 0 and (nginx_running.stdout | trim) == 'true'

    - name: Wait for nginx socket
      ansible.builtin.stat:
        path: "{{ nginx_socket }}"
      register: nginx_sock
      until: nginx_sock.stat.exists
      retries: 12
      delay: 5

    # Права на сокет дальше держит фоновый цикл в web-контейнере (см. compose).
    - name: Allow xray to use the socket
      ansible.builtin.file:
        path: "{{ nginx_socket }}"
        mode: "0666"

    - name: Issue and install certificate
      ansible.builtin.include_tasks: tasks/nginx_cert_issue.yml

    - name: Check ufw is available for auto open
      ansible.builtin.shell: command -v ufw
      args:
        executable: /bin/bash
      register: nginx_ufw_bin
      changed_when: false
      failed_when: false
      when: nginx_open_ports | bool

    - name: Warn when ufw is missing for auto open
      ansible.builtin.debug:
        msg: "ufw not found — ports 80,443 NOT opened. Install ufw (base/firewall templates) or open them manually"
      when:
        - nginx_open_ports | bool
        - nginx_ufw_bin.rc | default(1) | int != 0

    - name: Open web ports in ufw
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "80"
        - "443"
      when:
        - nginx_open_ports | bool
        - nginx_ufw_bin.rc | default(1) | int == 0

    - name: Show deploy summary
      ansible.builtin.debug:
        msg: "domain={{ nginx_domain | trim }} dir={{ nginx_dir }} cert={{ 'issued' if (nginx_issue is changed) else ('up to date (acme.sh skip)' if (nginx_issue.rc | default(-1)) == 2 else ((('existing (staging)' if (nginx_cert_is_staging | bool) else 'existing') if not (nginx_cert_missing | bool) else 'missing'))) }}{{ ' (staging requested — re-run with staging=false for a trusted cert)' if (nginx_staging | bool) else '' }} socket={{ nginx_socket }} firewall={{ 'manual' if not (nginx_open_ports | bool) else ('open' if (nginx_ufw_bin.rc | default(1) | int == 0) else 'skipped (no ufw)') }} (port 443 goes live after Xray install)"
