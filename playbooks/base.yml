---
- name: Base setup for Debian
  hosts: "{{ target }}"
  gather_facts: true
  become: true
  vars:
    base_timezone: Etc/UTC
    base_packages:
      - python3
      - curl
      - btop
      - ufw
  tasks:
    - name: Normalize base_packages to list
      ansible.builtin.set_fact:
        base_packages_list: "{{ (base_packages | default([], true)).replace(',', '\n').splitlines() | map('trim') | select | list if (base_packages | default([], true)) is string else (base_packages | default([], true)) }}"

    - name: Set timezone
      community.general.timezone:
        name: "{{ base_timezone }}"

    - name: Install base packages
      ansible.builtin.apt:
        name: "{{ base_packages_list }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
