---
- name: Remnawave node add (panel registration only)
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    remnawave_node_name: ""
    remnawave_node_address: ""
    remnawave_node_port: ""
    remnawave_country: XX
    remnawave_config_profile: ""
    remnawave_inbounds: ""
    remnawave_note: ""
    remnawave_token: ""
    remnawave_validate_certs: true
    remnawave_uuid_re: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  tasks:
    - name: Validate node name and address
      ansible.builtin.fail:
        msg: "remnawave_node_name must be 3..30 chars, remnawave_node_address must not be empty"
      when:
        - (remnawave_node_name | length < 3 or remnawave_node_name | length > 30)
          or (remnawave_node_address | default('') | trim | length < 2)

    - name: Validate explicit port value
      ansible.builtin.fail:
        msg: "remnawave_node_port must be 1..65535, got {{ remnawave_node_port }}"
      when:
        - remnawave_node_port | default('') | string | length > 0
        - (remnawave_node_port | int < 1) or (remnawave_node_port | int > 65535)

    - name: Validate country and note
      ansible.builtin.fail:
        msg: "remnawave_country must be <= 2 chars, remnawave_note <= 255 chars"
      when:
        - (remnawave_country | default('XX') | length > 2)
          or (remnawave_note | default('') | length > 255)

    - name: Validate explicit inbound UUIDs format
      ansible.builtin.fail:
        msg: "Every remnawave_inbounds line must be a UUID"
      when:
        - remnawave_inbounds | default('') | length > 0
        - (((remnawave_inbounds.replace(',', '\n').splitlines() | map('trim') | select | list) | select('match', remnawave_uuid_re) | list | length) != ((remnawave_inbounds.replace(',', '\n').splitlines() | map('trim') | select | list) | length))

    - name: Resolve panel credentials
      ansible.builtin.include_role:
        name: remnawave_panel
        tasks_from: auth

    - name: Fetch panel nodes
      ansible.builtin.include_role:
        name: remnawave_panel
        tasks_from: nodes

    - name: Refuse an ambiguous node name
      ansible.builtin.fail:
        msg: "Panel has {{ remnawave_node_matches | default([]) | length }} nodes named '{{ remnawave_node_name }}'. Remove duplicates in the panel UI first"
      when: (remnawave_node_matches | default([]) | length) > 1

    - name: Resolve port for an existing node
      ansible.builtin.set_fact:
        remnawave_port_final: "{{ remnawave_existing.port | int }}"
      when:
        - remnawave_existing | length > 0
        - remnawave_existing.port | default('', true) | string | length > 0

    - name: Refuse existing node without a valid stored port
      ansible.builtin.fail:
        msg: "Panel entry '{{ remnawave_node_name }}' has no valid port ({{ remnawave_existing.port | default('empty', true) }}). Fix it in panel UI (or delete and recreate the node), then re-run add"
      when:
        - remnawave_existing | length > 0
        - (remnawave_existing.port | default('', true) | string | length == 0)
          or (remnawave_existing.port | int < 1) or (remnawave_existing.port | int > 65535)

    - name: Refuse silently changing port of an existing node
      ansible.builtin.fail:
        msg: "Panel entry '{{ remnawave_node_name }}' already uses port {{ remnawave_existing.port }} but survey asks {{ remnawave_node_port }}. Change it in panel UI or delete and recreate the node"
      when:
        - remnawave_existing | length > 0
        - remnawave_node_port | default('') | string | length > 0
        - remnawave_existing.port is not none
        - (remnawave_existing.port | int) != (remnawave_node_port | int)

    - name: Resolve port for a new node
      ansible.builtin.set_fact:
        remnawave_port_final: "{{ remnawave_node_port | int if (remnawave_node_port | default('') | string | length > 0) else (range(1024, 65536) | difference(remnawave_ports_taken) | random) }}"
      vars:
        # Случайный порт не должен совпасть с портом другой ноды на том же адресе.
        remnawave_ports_taken: "{{ remnawave_nodes | default([]) | selectattr('address', 'defined') | selectattr('address', 'equalto', remnawave_node_address | default('') | trim) | map(attribute='port') | select | map('int') | list }}"
      when: remnawave_existing | length == 0

    - name: Refuse explicit port already used on the same address
      ansible.builtin.fail:
        msg: "Port {{ remnawave_port_final }} is already used by another panel node on address {{ remnawave_node_address | trim }}"
      when:
        - remnawave_existing | length == 0
        - remnawave_node_port | default('') | string | length > 0
        - (remnawave_port_final | int) in (remnawave_nodes | default([]) | selectattr('address', 'defined') | selectattr('address', 'equalto', remnawave_node_address | default('') | trim) | map(attribute='port') | select | map('int') | list)

    - name: Warn about privileged explicit port
      ansible.builtin.debug:
        msg: "Port {{ remnawave_port_final }} is privileged (<1024) — agent container may fail to bind it without extra capabilities"
      when: remnawave_port_final | int < 1024

    - name: Show existing node summary
      ansible.builtin.debug:
        msg: "node={{ remnawave_node_name }} uuid={{ remnawave_existing.uuid | default('', true) }} address={{ remnawave_existing.address | default('', true) }} port={{ remnawave_port_final }} panel={{ remnawave_panel_base }} (already registered; add never changes an existing entry)"
      when: remnawave_existing | length > 0

    - name: Warn when existing address differs from survey
      ansible.builtin.debug:
        msg: "Panel entry address is '{{ remnawave_existing.address | default('', true) }}', survey says '{{ remnawave_node_address | trim }}'. Add does not update existing entries — change it in panel UI"
      when:
        - remnawave_existing | length > 0
        - (remnawave_existing.address | default('', true) | trim) != (remnawave_node_address | trim)

    - name: Stop after an existing node
      ansible.builtin.meta: end_play
      when: remnawave_existing | length > 0

    - name: Resolve config profile reference
      ansible.builtin.set_fact:
        remnawave_profile_want: "{{ remnawave_config_profile if (remnawave_config_profile | default('') | length > 0) else (remnawave_default_config_profile | default('')) }}"

    - name: Fetch config profiles for auto resolve
      ansible.builtin.uri:
        url: "{{ remnawave_panel_base }}/api/config-profiles"
        headers:
          Authorization: "Bearer {{ remnawave_token_final }}"
          Accept: application/json
        return_content: true
        timeout: 30
        validate_certs: "{{ remnawave_validate_certs | bool }}"
      register: remnawave_profiles
      delegate_to: localhost
      become: false
      no_log: true
      when: remnawave_profile_want | default('') | length == 0

    - name: Match default config profile
      ansible.builtin.set_fact:
        remnawave_profile_match: "{{ remnawave_profiles.json.response.configProfiles | selectattr('name', 'defined') | list }}"
      when: remnawave_profile_want | default('') | length == 0

    - name: Resolve profile UUID from keyword match
      ansible.builtin.set_fact:
        remnawave_profile_uuid: "{{ (remnawave_exact | first).uuid if (remnawave_exact | length == 1) else ((remnawave_contains | first).uuid if (remnawave_contains | length == 1 and remnawave_exact | length == 0) else '') }}"
        remnawave_profile_candidates: "{{ (remnawave_exact + remnawave_contains) | map(attribute='name') | list }}"
      vars:
        # Скобки обязательны: фильтр связывает сильнее `+`, и unique применялся
        # только к последнему списку.
        remnawave_exact: "{{ (remnawave_profile_match | selectattr('name', 'equalto', 'default') | list + remnawave_profile_match | selectattr('name', 'equalto', 'Default') | list + remnawave_profile_match | selectattr('name', 'equalto', 'DEFAULT') | list) | unique(attribute='uuid') | list }}"
        remnawave_contains: "{{ (remnawave_profile_match | selectattr('name', 'search', '(?i)default') | list + remnawave_profile_match | selectattr('name', 'search', '(?i)дефолт') | list) | unique(attribute='uuid') | list }}"
      when: remnawave_profile_want | default('') | length == 0

    - name: Fail when default profile is ambiguous or missing
      ansible.builtin.fail:
        msg: "No unique default config profile (candidates: {{ remnawave_profile_candidates | join(', ') | default('none — available: ' + (remnawave_profile_match | map(attribute='name') | join(', ')), true) }}). Set remnawave_config_profile explicitly (UUID or name)"
      when:
        - remnawave_profile_want | default('') | length == 0
        - remnawave_profile_uuid | default('') | length == 0

    - name: Fetch config profiles for explicit name reference
      ansible.builtin.uri:
        url: "{{ remnawave_panel_base }}/api/config-profiles"
        headers:
          Authorization: "Bearer {{ remnawave_token_final }}"
          Accept: application/json
        return_content: true
        timeout: 30
        validate_certs: "{{ remnawave_validate_certs | bool }}"
      register: remnawave_profiles_explicit
      delegate_to: localhost
      become: false
      no_log: true
      when:
        - remnawave_profile_want | default('') | length > 0
        - not (remnawave_profile_want is match(remnawave_uuid_re))

    - name: Resolve profile UUID from explicit reference
      ansible.builtin.set_fact:
        remnawave_profile_uuid: "{{ remnawave_profile_want if (remnawave_profile_want is match(remnawave_uuid_re)) else ((remnawave_named | first).uuid if (remnawave_named | length == 1) else '') }}"
        remnawave_profile_candidates: "{{ remnawave_named | map(attribute='name') | list }}"
      vars:
        # Точное совпадение имени важнее подстроки; имя экранируется для regex.
        remnawave_named_exact: "{{ remnawave_named_all | selectattr('name', 'equalto', remnawave_profile_want) | list }}"
        remnawave_named: "{{ remnawave_named_exact if (remnawave_named_exact | length == 1) else (remnawave_named_all | selectattr('name', 'search', '(?i)' ~ (remnawave_profile_want | regex_escape)) | list | unique(attribute='uuid') | list) }}"
        remnawave_named_all: "{{ (remnawave_profiles_explicit | default({})).json.response.configProfiles | default([]) }}"
      when:
        - remnawave_profile_want | default('') | length > 0
        - not (remnawave_profile_want is match(remnawave_uuid_re))

    - name: Resolve explicit profile UUID
      ansible.builtin.set_fact:
        remnawave_profile_uuid: "{{ remnawave_profile_want }}"
      when:
        - remnawave_profile_want | default('') | length > 0
        - remnawave_profile_want is match(remnawave_uuid_re)

    - name: Fail when explicit profile reference is ambiguous or missing
      ansible.builtin.fail:
        msg: "Config profile '{{ remnawave_profile_want }}' not found or ambiguous (candidates: {{ remnawave_profile_candidates | join(', ') | default('none', true) }}). Use exact UUID or unique name"
      when:
        - remnawave_profile_want | default('') | length > 0
        - remnawave_profile_uuid | default('') | length == 0

    - name: Fetch inbounds of resolved profile
      ansible.builtin.uri:
        url: "{{ remnawave_panel_base }}/api/config-profiles/{{ remnawave_profile_uuid }}/inbounds"
        headers:
          Authorization: "Bearer {{ remnawave_token_final }}"
          Accept: application/json
        return_content: true
        timeout: 30
        validate_certs: "{{ remnawave_validate_certs | bool }}"
      register: remnawave_inbounds_resp
      delegate_to: localhost
      become: false
      no_log: true

    - name: Resolve active inbounds
      ansible.builtin.set_fact:
        remnawave_inbounds_final: "{{ remnawave_want_list if (remnawave_want_list | length > 0) else (remnawave_inbounds_resp.json.response.inbounds | map(attribute='uuid') | list) }}"
      vars:
        remnawave_want_list: "{{ ((remnawave_inbounds if (remnawave_inbounds | default('') | length > 0) else (remnawave_default_inbounds | default(''))).replace(',', '\n').splitlines() | map('trim') | select | list) if ((remnawave_inbounds | default('') | length > 0) or (remnawave_default_inbounds | default('') | length > 0)) else [] }}"

    - name: Validate inbounds belong to resolved profile
      ansible.builtin.fail:
        msg: "Inbounds not in profile (available tags: {{ remnawave_inbounds_resp.json.response.inbounds | map(attribute='tag') | join(', ') }})"
      when:
        - remnawave_inbounds_final | difference(remnawave_inbounds_resp.json.response.inbounds | map(attribute='uuid') | list) | length > 0

    - name: Create panel node
      ansible.builtin.uri:
        url: "{{ remnawave_panel_base }}/api/nodes"
        method: POST
        headers:
          Authorization: "Bearer {{ remnawave_token_final }}"
          Accept: application/json
        body_format: json
        body:
          name: "{{ remnawave_node_name }}"
          address: "{{ remnawave_node_address | trim }}"
          port: "{{ remnawave_port_final | int }}"
          countryCode: "{{ ((remnawave_country | default('XX', true) | trim) or 'XX') | upper }}"
          note: "{{ remnawave_note | default('') }}"
          configProfile:
            activeConfigProfileUuid: "{{ remnawave_profile_uuid }}"
            activeInbounds: "{{ remnawave_inbounds_final }}"
        status_code: 201
        timeout: 30
        validate_certs: "{{ remnawave_validate_certs | bool }}"
        return_content: true
      register: remnawave_created
      delegate_to: localhost
      become: false
      no_log: true

    - name: Show registration summary
      ansible.builtin.debug:
        msg: "node={{ remnawave_node_name }} uuid={{ remnawave_created.json.response.uuid | default('') }} address={{ remnawave_node_address | trim }} port={{ remnawave_port_final }} panel={{ remnawave_panel_base }} profile={{ remnawave_profile_uuid }} inbounds={{ remnawave_inbounds_final | length }} (next: run remnawave_node_deploy on the host)"
