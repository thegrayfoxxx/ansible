---
- name: Free disk space
  hosts: "{{ target }}"
  gather_facts: false
  become: true
  vars:
    journal_max_age: 14d
    journal_max_size: 500M
    docker_prune: false
    docker_prune_volumes: false
    docker_prune_until: ""
    apt_clean: true
    cleanup_confirmed: false
  tasks:
    - name: Require confirmation for volume prune
      ansible.builtin.fail:
        msg: "docker volume prune deletes data. Set cleanup_confirmed=true to allow (volumes are kept by default)"
      when:
        - docker_prune_volumes | bool
        - not (cleanup_confirmed | bool)

    - name: Disk usage before cleanup
      ansible.builtin.command: df -h /
      register: df_before
      changed_when: false

    - name: Show disk usage before cleanup
      ansible.builtin.debug:
        var: df_before.stdout_lines

    - name: Apt autoremove and autoclean
      ansible.builtin.apt:
        autoremove: true
        autoclean: "{{ apt_clean | bool }}"
      when: apt_clean | bool

    - name: Validate journal_max_age format
      ansible.builtin.fail:
        msg: "journal_max_age must be a systemd time span like 14d, got {{ journal_max_age }}"
      when:
        - not (journal_max_age is regex('^[0-9]+\\s*(s|sec|secs|m|min|mins|h|hr|hrs|d|day|days|w|week|weeks|M|month|months|y|year|years)s?$'))

    - name: Validate journal_max_size format
      ansible.builtin.fail:
        msg: "journal_max_size must be bytes like 500M, got {{ journal_max_size }}"
      when:
        - not (journal_max_size is regex('^[0-9]+[BKMGTP]?$'))

    # journalctl всегда пишет "Vacuuming done, freed X"; изменение — только если X не 0B.
    - name: Vacuum systemd journal by time
      ansible.builtin.command: "journalctl --vacuum-time={{ journal_max_age }}"
      register: journal_time
      changed_when: journal_time.stderr is not search('freed 0B')

    - name: Vacuum systemd journal by size
      ansible.builtin.command: "journalctl --vacuum-size={{ journal_max_size }}"
      register: journal_size
      changed_when: journal_size.stderr is not search('freed 0B')

    # `command -v` — встроенная команда shell, через модуль command она не запускается.
    - name: Check if Docker exists
      ansible.builtin.shell: command -v docker
      register: docker_bin
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Validate docker_prune_until format
      ansible.builtin.fail:
        msg: "docker_prune_until must be a duration like 24h, got {{ docker_prune_until }}"
      when:
        - docker_prune | bool
        - docker_prune_until | length > 0
        - not (docker_prune_until is regex('^[0-9]+[smhd]$'))

    # Не `docker system prune`: он удаляет и остановленные контейнеры
    # (например, намеренно остановленную ноду или бэкап-контейнер после move/adopt).
    - name: Prune unused Docker images, networks and build cache
      ansible.builtin.command: "docker {{ item }} prune -f{{ ' -a' if item == 'image' else '' }}{{ (' --filter until=' + docker_prune_until) if (docker_prune_until | length > 0) else '' }}"
      loop: [image, network, builder]
      register: docker_prune_out
      changed_when: docker_prune_out.stdout is search('Total reclaimed space:\s*[1-9]') or docker_prune_out.stdout is search('^Deleted', multiline=True)
      when:
        - docker_prune | bool
        - docker_bin.rc == 0

    - name: Show Docker prune result
      ansible.builtin.debug:
        msg: "{{ docker_prune_out.results | map(attribute='stdout_lines') | list }}"
      when:
        - docker_prune | bool
        - docker_bin.rc == 0

    - name: Prune Docker volumes
      ansible.builtin.command: docker volume prune -f
      register: docker_volumes_out
      changed_when: docker_volumes_out.stdout is not search('Total reclaimed space:\s*0\s*B(\s|$)')
      when:
        - docker_prune_volumes | bool
        - docker_bin.rc == 0

    - name: Show Docker volumes prune result
      ansible.builtin.debug:
        var: docker_volumes_out.stdout_lines
      when:
        - docker_prune_volumes | bool
        - docker_bin.rc == 0

    - name: Disk usage after cleanup
      ansible.builtin.command: df -h /
      register: df_after
      changed_when: false

    - name: Show disk usage after cleanup
      ansible.builtin.debug:
        var: df_after.stdout_lines
