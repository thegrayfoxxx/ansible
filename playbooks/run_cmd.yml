---
- name: Run arbitrary command
  hosts: "{{ target }}"
  gather_facts: false
  become: true
  vars:
    cmd: ""
    use_shell: true
    cmd_chdir: ""
    cmd_env: {}
    cmd_become: true
    cmd_tail: 0
    allow_fail: false
    cmd_confirmed: false
  tasks:
    - name: Validate cmd is set
      ansible.builtin.fail:
        msg: "Set cmd, e.g. df -h (via Extra vars)"
      when: cmd | length == 0

    - name: Require confirmation for fleet command
      ansible.builtin.fail:
        msg: "Running command on {{ ansible_play_hosts_all | length }} hosts at once needs cmd_confirmed=true. Set it in survey (or narrow target/Limit to one host)"
      when:
        - ansible_play_hosts_all | length > 1
        - not (cmd_confirmed | bool)

    - name: Validate cmd_env is a JSON object
      ansible.builtin.fail:
        msg: "cmd_env must be a JSON object like {\"FOO\": \"1\"}, got {{ cmd_env }}"
      when:
        - cmd_env is string
        - cmd_env | length > 0
        - not (cmd_env | trim is regex('^\\{.*\\}$'))

    - name: Normalize cmd_env to dict
      ansible.builtin.set_fact:
        cmd_env_dict: "{{ (cmd_env | from_json) if (cmd_env is string and cmd_env | length > 0) else (cmd_env if cmd_env is mapping else {}) }}"

    - name: Run command via shell
      ansible.builtin.shell: "{{ cmd }}"
      args:
        chdir: "{{ cmd_chdir if cmd_chdir | length > 0 else omit }}"
      environment: "{{ cmd_env_dict }}"
      become: "{{ cmd_become }}"
      register: cmd_shell_out
      changed_when: true
      failed_when: not (allow_fail | bool) and cmd_shell_out.rc != 0
      when: use_shell | bool

    - name: Run command via command
      ansible.builtin.command: "{{ cmd }}"
      args:
        chdir: "{{ cmd_chdir if cmd_chdir | length > 0 else omit }}"
      environment: "{{ cmd_env_dict }}"
      become: "{{ cmd_become }}"
      register: cmd_raw_out
      changed_when: true
      failed_when: not (allow_fail | bool) and cmd_raw_out.rc != 0
      when: not (use_shell | bool)

    - name: Pick executed result
      ansible.builtin.set_fact:
        cmd_out: "{{ cmd_shell_out if not cmd_shell_out.skipped | default(false) else cmd_raw_out }}"

    - name: Show command return code
      ansible.builtin.debug:
        msg: "rc={{ cmd_out.rc }}"

    - name: Show command stdout
      ansible.builtin.debug:
        var: _cmd_stdout
      vars:
        _cmd_stdout: "{{ cmd_out.stdout_lines[-(cmd_tail | int):] if (cmd_tail | int) > 0 else cmd_out.stdout_lines }}"
      when: cmd_out.stdout_lines | length > 0

    - name: Show command stderr
      ansible.builtin.debug:
        var: _cmd_stderr
      vars:
        _cmd_stderr: "{{ cmd_out.stderr_lines[-(cmd_tail | int):] if (cmd_tail | int) > 0 else cmd_out.stderr_lines }}"
      when: cmd_out.stderr_lines | length > 0
