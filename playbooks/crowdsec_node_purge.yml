---
- name: CrowdSec node purge — backup containers + dirs
  hosts: "{{ target | default('localhost', true) }}"
  gather_facts: false
  # docker и find по /root без root молча возвращают пусто → "nothing to purge".
  become: true
  serial: 1
  vars:
    crowdsec_purge_action: inspect
    crowdsec_purge_confirm: false
    crowdsec_purge_confirmed: false
    crowdsec_dir: /opt/crowdsec
    crowdsec_agent_container: crowdsec-agent
    crowdsec_bouncer_container: crowdsec-bouncer
    # Явно: имена контейнеров / пути каталогов через запятую или по строке.
    # Пусто — все бэкапы CrowdSec на хосте (inspect покажет список).
    crowdsec_purge_container: ""
    crowdsec_purge_dir: ""
  tasks:
    - name: Validate purge action
      ansible.builtin.fail:
        msg: "crowdsec_purge_action must be inspect or purge, got '{{ crowdsec_purge_action }}'"
      when: crowdsec_purge_action not in ['inspect', 'purge']

    - name: Require fleet confirmation for multiple hosts
      ansible.builtin.fail:
        msg: "Purge on multiple hosts requires crowdsec_purge_confirmed=true"
      when:
        - crowdsec_purge_action == 'purge'
        - ansible_play_hosts_all | length > 1
        - not (crowdsec_purge_confirmed | default(false, true) | bool)

    - name: Require confirmation for purge
      ansible.builtin.fail:
        msg: "Purge is destructive. Set crowdsec_purge_confirm=true to allow action=purge"
      when:
        - crowdsec_purge_action == 'purge'
        - not (crowdsec_purge_confirm | bool)

    - name: Find and purge CrowdSec backups
      ansible.builtin.include_tasks: tasks/purge_backups.yml
      vars:
        crowdsec_names_re: "{{ ['crowdsec-agent', 'crowdsec-bouncer', crowdsec_agent_container | default('', true), crowdsec_bouncer_container | default('', true)] | map('trim') | select | unique | map('regex_escape') | join('|') }}"
        purge_label: crowdsec
        purge_action: "{{ crowdsec_purge_action }}"
        purge_container_regex: "^({{ crowdsec_names_re }})-(adopt|move|moved)-bak-[0-9]+$"
        purge_dir_regex: '^/.*\.(adopt|move)-bak-[0-9]+$'
        purge_dir_marker: "crowdsecurity/crowdsec|cs-firewall-bouncer"
        purge_containers_explicit: "{{ crowdsec_purge_container }}"
        purge_dirs_explicit: "{{ crowdsec_purge_dir }}"
        purge_search_roots: [/opt, /srv, /root, /home]
