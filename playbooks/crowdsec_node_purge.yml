---
- name: CrowdSec node purge — backup container + dir
  hosts: "{{ target | default('localhost', true) }}"
  gather_facts: false
  become: false
  serial: 1
  vars:
    crowdsec_purge_action: inspect
    crowdsec_purge_confirm: false
    crowdsec_purge_confirmed: false
    crowdsec_dir: /opt/crowdsec
    crowdsec_purge_container: ""
    crowdsec_purge_dir: ""
  tasks:
    - name: Validate purge action
      ansible.builtin.fail:
        msg: "crowdsec_purge_action must be inspect or purge, got '{{ crowdsec_purge_action }}'"
      when: crowdsec_purge_action not in ['inspect', 'purge']

    - name: Require fleet confirmation for multiple hosts
      ansible.builtin.fail:
        msg: "Purge on multiple hosts requires crowdsec_purge_confirmed=true"
      when:
        - crowdsec_purge_action == 'purge'
        - ansible_play_hosts_all | length > 1
        - not (crowdsec_purge_confirmed | default(false, true) | bool)

    - name: Require confirmation for purge
      ansible.builtin.fail:
        msg: "Purge is destructive. Set crowdsec_purge_confirm=true to allow action=purge"
      when:
        - crowdsec_purge_action == 'purge'
        - not (crowdsec_purge_confirm | bool)

    - name: Auto-discover backup containers
      ansible.builtin.shell: >-
        docker ps -a --format "{{ '{{.Names}}' }}" | grep -- '-bak-' || true
      register: crowdsec_purge_discovered_containers
      changed_when: false
      failed_when: false
      no_log: true

    - name: Auto-discover backup directories
      ansible.builtin.shell: >-
        find /opt /home /root /srv /var -maxdepth 3 -type d -name "*-bak-*" 2>/dev/null | sort -u || true
      register: crowdsec_purge_discovered_dirs
      changed_when: false
      failed_when: false

    - name: Show purge inspection
      when: crowdsec_purge_action == 'inspect'
      ansible.builtin.debug:
        msg: >-
          action={{ crowdsec_purge_action }} host={{ inventory_hostname }}
          discovered_containers={{ crowdsec_purge_discovered_containers.stdout_lines | default([]) | join(', ') or '(none)' }}
          discovered_dirs={{ crowdsec_purge_discovered_dirs.stdout_lines | default([]) | join(', ') or '(none)' }}
          explicit_container={{ crowdsec_purge_container | default('', true) }}
          explicit_dir={{ crowdsec_purge_dir | default('', true) }}

    - name: Stop after inspect (this host only)
      when: crowdsec_purge_action == 'inspect'
      ansible.builtin.meta: end_host

    - name: Resolve purge container (explicit or auto-discovered)
      when: crowdsec_purge_action == 'purge'
      ansible.builtin.set_fact:
        crowdsec_purge_container_resolved: >-
          {{ crowdsec_purge_container | default('', true) | trim
             if (crowdsec_purge_container | default('', true) | trim | length) > 0
             else (crowdsec_purge_discovered_containers.stdout_lines | default([]) | first | default('', true)) }}

    - name: Resolve purge dir (explicit or auto-discovered)
      when: crowdsec_purge_action == 'purge'
      ansible.builtin.set_fact:
        crowdsec_purge_dir_resolved: >-
          {{ crowdsec_purge_dir | default('', true) | trim
             if (crowdsec_purge_dir | default('', true) | trim | length) > 0
             else (crowdsec_purge_discovered_dirs.stdout_lines | default([]) | first | default('', true)) }}

    - name: Nothing to purge
      ansible.builtin.debug:
        msg: "nothing to purge on {{ inventory_hostname }} — no backup containers or directories found"
      when:
        - crowdsec_purge_action == 'purge'
        - (crowdsec_purge_container_resolved | default('', true) | trim | length) == 0
        - (crowdsec_purge_dir_resolved | default('', true) | trim | length) == 0

    - name: Skip host with nothing to purge
      ansible.builtin.meta: end_host
      when:
        - crowdsec_purge_action == 'purge'
        - (crowdsec_purge_container_resolved | default('', true) | trim | length) == 0
        - (crowdsec_purge_dir_resolved | default('', true) | trim | length) == 0

    - name: Purge backup artifacts
      when: crowdsec_purge_action == 'purge'
      block:
        - name: Validate purge dir
          ansible.builtin.fail:
            msg: "Refusing to purge unsafe path '{{ crowdsec_purge_dir_resolved }}'. Set crowdsec_purge_dir to the backup dir"
          when: >-
            (crowdsec_purge_dir_resolved | length == 0)
            or (not (crowdsec_purge_dir_resolved is match('^/.+')))
            or ('..' in crowdsec_purge_dir_resolved)
            or ((crowdsec_purge_dir_resolved | regex_replace('/+$', '') | split('/') | length) < 3)

        - name: Remove purge container
          ansible.builtin.command:
            argv: ["docker", "rm", "-f", "{{ crowdsec_purge_container_resolved }}"]
          changed_when: true
          when: (crowdsec_purge_container_resolved | default('', true) | trim | length) > 0

        - name: Remove purge dir
          ansible.builtin.file:
            path: "{{ crowdsec_purge_dir_resolved | regex_replace('/+$', '') }}"
            state: absent
          when: (crowdsec_purge_dir_resolved | default('', true) | trim | length) > 0
          become: true

    - name: Show purge summary
      when: crowdsec_purge_action == 'purge'
      ansible.builtin.debug:
        msg: "purged backup container={{ crowdsec_purge_container_resolved }} dir={{ crowdsec_purge_dir_resolved }} on {{ inventory_hostname }}"