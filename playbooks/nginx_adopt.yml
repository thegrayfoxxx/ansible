---
- name: Adopt manually installed nginx fallback under playbook management
  hosts: "{{ target }}"
  gather_facts: false
  become: true
  vars:
    nginx_adopt_action: inspect
    nginx_web_container: ""
    nginx_old_dir: ""
    nginx_dir: /opt/nginx
    nginx_email: ""
    nginx_open_ports: false
    nginx_overwrite_conf: false
    nginx_socket: /dev/shm/nginx.sock
    nginx_new_web_container: fallback-web
    nginx_new_acme_container: fallback-acme
  tasks:
    - name: Validate adopt action value
      ansible.builtin.fail:
        msg: "nginx_adopt_action must be inspect or migrate, got {{ nginx_adopt_action }}"
      when: nginx_adopt_action not in ['inspect', 'migrate']

    - name: Require exactly one node host
      ansible.builtin.fail:
        msg: "Adopt addresses one node per run — point target at a single host, got {{ ansible_play_hosts_all | length }}"
      when: ansible_play_hosts_all | length != 1

    - name: Normalize project dir
      ansible.builtin.set_fact:
        nginx_dir: "{{ (nginx_dir | default('') | trim) or '/opt/nginx' }}"

    - name: Validate project dir
      ansible.builtin.fail:
        msg: "nginx_dir must be an absolute path, got '{{ nginx_dir }}'"
      when: not (nginx_dir is match('^/.+'))

    - name: Check docker is available
      ansible.builtin.shell: command -v docker
      args:
        executable: /bin/bash
      register: nginx_docker_bin
      changed_when: false
      failed_when: false

    - name: Require docker on node
      ansible.builtin.fail:
        msg: "docker not found. Run the docker template on this host first"
      when: nginx_docker_bin.rc != 0

    - name: List running containers
      ansible.builtin.command: docker ps --format json
      register: nginx_ps
      changed_when: false
      failed_when: false

    - name: Require working docker daemon
      ansible.builtin.fail:
        msg: "docker ps failed — is dockerd running on {{ inventory_hostname }}?"
      when: nginx_ps.rc != 0

    - name: Resolve nginx candidates
      ansible.builtin.set_fact:
        nginx_candidates: "{{ (nginx_ps.stdout_lines | default([]) | map('from_json') | selectattr('Image', 'search', '(?i)(^|/)nginx:') | map(attribute='Names') | list) }}"

    - name: Resolve web container
      ansible.builtin.set_fact:
        nginx_web_final: "{{ (nginx_web_container | default('') | trim) or ((nginx_candidates | first) if (nginx_candidates | length == 1) else '') }}"

    - name: Require single nginx container
      ansible.builtin.fail:
        msg: "Nginx container not resolved: found {{ nginx_candidates | length }} running nginx:* containers ({{ nginx_candidates | join(', ') | default('none', true) }}). Set explicit Nginx container"
      when: nginx_web_final | default('') | trim | length == 0

    - name: Validate web container name
      ansible.builtin.fail:
        msg: "Container name must match ^[a-zA-Z0-9_.-]+$, got '{{ nginx_web_final }}'"
      when: nginx_web_final is not match('^[a-zA-Z0-9_.-]+$')

    - name: Inspect web container
      ansible.builtin.command: docker inspect {{ nginx_web_final }}
      register: nginx_inspect_raw
      changed_when: false
      failed_when: false

    - name: Require web container
      ansible.builtin.fail:
        msg: "Container '{{ nginx_web_final }}' not found on {{ inventory_hostname }} (stopped?). Start it or set explicit Nginx container"
      when: nginx_inspect_raw.rc != 0

    - name: Parse container metadata
      ansible.builtin.set_fact:
        nginx_inspect: "{{ (nginx_inspect_raw.stdout | from_json | first) | default({}) }}"

    - name: Resolve compose metadata
      ansible.builtin.set_fact:
        nginx_compose_labels: "{{ nginx_inspect.Config.Labels | default({}) }}"
        nginx_inspect_env: "{{ nginx_inspect.Config.Env | default([]) }}"
        nginx_inspect_mounts: "{{ nginx_inspect.Config.Mounts | default(nginx_inspect.Mounts | default([])) }}"

    - name: Resolve label config file
      ansible.builtin.set_fact:
        nginx_label_config: "{{ ((nginx_compose_labels['com.docker.compose.project.config_files'] | default('')).split(',') | map('trim') | select | list | first) | default('') }}"

    - name: Resolve old project dir
      ansible.builtin.set_fact:
        nginx_old_dir_final: "{{ (nginx_old_dir | default('') | trim) or (nginx_compose_labels['com.docker.compose.project.working_dir'] | default('') | trim) or ((nginx_label_config | dirname) if (nginx_label_config | length > 0) else '') }}"

    - name: Require discovered project dir
      ansible.builtin.fail:
        msg: "No compose metadata found for '{{ nginx_web_final }}' (manual docker run?). Set explicit Old project dir"
      when: nginx_old_dir_final | default('') | trim | length == 0

    - name: Validate old project dir
      ansible.builtin.fail:
        msg: "Old project dir must be an absolute path, got '{{ nginx_old_dir_final }}'"
      when: not (nginx_old_dir_final is match('^/.+'))

    - name: Resolve bind source by destination
      ansible.builtin.set_fact:
        nginx_html_mount: "{{ (nginx_inspect_mounts | selectattr('Destination', 'in', ['/usr/share/nginx/html/index.html', '/usr/share/nginx/html']) | list | first) | default({}) }}"
        nginx_le_mount: "{{ (nginx_inspect_mounts | selectattr('Destination', 'equalto', '/etc/letsencrypt') | list | first) | default({}) }}"
        nginx_conf_mount: "{{ (nginx_inspect_mounts | selectattr('Destination', 'equalto', '/etc/nginx/templates/default.conf.template') | list | first) | default({}) }}"

    - name: Require bind mounts for migration
      ansible.builtin.fail:
        msg: "Migration needs bind mounts for html/letsencrypt/nginx-conf, found: html={{ nginx_html_mount | default({}) != {} }} letsencrypt={{ nginx_le_mount | default({}) != {} }} conf={{ nginx_conf_mount | default({}) != {} }}. Named volumes or missing mounts are not supported in v1"
      when:
        - (nginx_html_mount | default({}) | length == 0)
          or (nginx_html_mount.Type | default('') != 'bind')
          or (nginx_le_mount | default({}) | length == 0)
          or (nginx_le_mount.Type | default('') != 'bind')
          or (nginx_conf_mount | default({}) | length == 0)
          or (nginx_conf_mount.Type | default('') != 'bind')

    - name: Resolve html source file
      ansible.builtin.set_fact:
        nginx_html_src: "{{ nginx_html_mount.Source if (nginx_html_mount.Destination == '/usr/share/nginx/html/index.html') else ((nginx_html_mount.Source + '/index.html') if (nginx_html_mount.Destination == '/usr/share/nginx/html') else '') }}"

    - name: Require known html mount form
      ansible.builtin.fail:
        msg: "Html mount has unexpected destination '{{ nginx_html_mount.Destination }}' (expected the index.html file or the html dir). Fix the old layout manually"
      when: nginx_html_src | length == 0

    - name: Resolve letsencrypt and config sources
      ansible.builtin.set_fact:
        nginx_le_src: "{{ nginx_le_mount.Source }}"
        nginx_conf_src: "{{ nginx_conf_mount.Source }}"

    - name: Check migrated sources exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ nginx_html_src }}"
        - "{{ nginx_le_src }}"
        - "{{ nginx_conf_src }}"
      register: nginx_src_stat

    - name: Require present migrated sources
      ansible.builtin.fail:
        msg: "Migrated source missing: {{ item.item }}. Inspect the old layout manually"
      loop: "{{ nginx_src_stat.results }}"
      when: not item.stat.exists

    - name: Discover acme container
      ansible.builtin.set_fact:
        nginx_acme_found: "{{ (nginx_ps.stdout_lines | default([]) | map('from_json') | selectattr('Image', 'search', '(?i)acme\\.sh') | list | length) > 0 }}"
        nginx_acme_name: "{{ ((nginx_ps.stdout_lines | default([]) | map('from_json') | selectattr('Image', 'search', '(?i)acme\\.sh') | map(attribute='Names') | list | first) | default('')) }}"

    - name: Inspect acme container
      ansible.builtin.command: docker inspect {{ nginx_acme_name }}
      register: nginx_acme_inspect_raw
      changed_when: false
      failed_when: false
      when: nginx_acme_found | bool

    - name: Resolve acme state source
      ansible.builtin.set_fact:
        nginx_acme_src: "{{ (((nginx_acme_inspect_raw.stdout | from_json | first) | default({})).Config.Mounts | default([]) | selectattr('Destination', 'equalto', '/acme.sh') | list | first | default({})).Source | default('') }}"
      when: nginx_acme_found | bool

    - name: Warn when acme state is not portable
      ansible.builtin.debug:
        msg: "acme container '{{ nginx_acme_name }}' has no /acme.sh bind mount — account state stays behind; future renewals will need a fresh issue"
      when:
        - nginx_acme_found | bool
        - nginx_acme_src | default('') | length == 0

    - name: Check old env file
      ansible.builtin.stat:
        path: "{{ nginx_old_dir_final }}/.env"
      register: nginx_old_env

    - name: Read old env file
      ansible.builtin.slurp:
        src: "{{ nginx_old_dir_final }}/.env"
      register: nginx_old_env_content
      when: nginx_old_env.stat.exists

    - name: Resolve domain and account
      ansible.builtin.set_fact:
        nginx_domain_final: "{{ (nginx_inspect_env | select('match', '^DOMAIN=') | list | first | default('') | regex_replace('^DOMAIN=', '') | trim) or ((nginx_old_env_content.content | default('') | b64decode).splitlines() | select('match', '^DOMAIN=') | list | first | default('') | regex_replace('^DOMAIN=', '') | trim) }}"
        nginx_email_final: "{{ (nginx_email | default('') | trim) or ((nginx_old_env_content.content | default('') | b64decode).splitlines() | select('match', '^EMAIL=') | list | first | default('') | regex_replace('^EMAIL=', '') | trim) }}"
        nginx_acme_server_final: "{{ (((nginx_old_env_content.content | default('') | b64decode).splitlines() | select('match', '^ACME_SERVER=') | list | first | default('') | regex_replace('^ACME_SERVER=', '')) | trim) or 'https://acme-v02.api.letsencrypt.org/directory' }}"

    - name: Require discovered domain
      ansible.builtin.fail:
        msg: "DOMAIN not found (checked container env and old .env). Refusing to migrate blind"
      when: nginx_domain_final | default('') | trim | length == 0

    - name: Require email for future issues
      ansible.builtin.fail:
        msg: "EMAIL not found in old .env and no survey override. It is required for future certificate re-issues — fill ACME email"
      when: nginx_email_final | default('') | trim | length == 0

    - name: Check ufw is available
      ansible.builtin.shell: command -v ufw
      args:
        executable: /bin/bash
      register: nginx_ufw_bin
      changed_when: false
      failed_when: false

    - name: Get ufw status
      ansible.builtin.command: ufw status
      register: nginx_ufw_status
      changed_when: false
      failed_when: false
      when: nginx_ufw_bin.rc == 0

    - name: Resolve ufw state
      ansible.builtin.set_fact:
        nginx_ufw_state: "{{ 'missing' if (nginx_ufw_bin.rc != 0) else ('active' if ('Status: active' in (nginx_ufw_status.stdout | default(''))) else 'inactive') }}"

    - name: Resolve web ports firewall state
      ansible.builtin.set_fact:
        nginx_ports_fw: "{{ nginx_ports_fw | default({}) | combine({item: ('na' if (nginx_ufw_state != 'active') else ('allowed' if ((nginx_ufw_status.stdout_lines | default([]) | select('search', '^' + item + '/') | select('search', 'ALLOW') | reject('search', 'OUT') | list | length) > 0) else 'closed'))}) }}"
      loop:
        - "80"
        - "443"

    - name: Warn when ufw blocks web ports
      ansible.builtin.debug:
        msg: "ufw is active but web ports not fully allowed {{ nginx_ports_fw }} — clients may not reach this node. Open 80,443/tcp via the firewall template"
      when: "'closed' in (nginx_ports_fw.values() | list)"

    - name: Show discovery summary
      ansible.builtin.debug:
        msg: "container={{ nginx_web_final }} old_dir={{ nginx_old_dir_final }} domain={{ nginx_domain_final }} email={{ 'set' if (nginx_email_final | trim | length > 0) else 'missing' }} acme={{ nginx_acme_name if (nginx_acme_found | bool) else 'missing (renewals need re-issue)' }} conf={{ nginx_conf_src }} target_dir={{ nginx_dir }} ufw={{ nginx_ufw_state }} ports_fw={{ nginx_ports_fw }}"

    - name: Stop at inspect
      ansible.builtin.meta: end_play
      when: nginx_adopt_action == 'inspect'

    - name: Refuse same-dir adoption
      ansible.builtin.fail:
        msg: "Old project already lives in {{ nginx_dir }} — nothing to relocate. Re-run nginx_fallback deploy to re-render standard files"
      when: nginx_old_dir_final.rstrip('/') == nginx_dir.rstrip('/')

    - name: Timestamp for backup
      ansible.builtin.command: date +%Y%m%d%H%M%S
      register: nginx_ts
      changed_when: false

    - name: Resolve backup names
      ansible.builtin.set_fact:
        nginx_backup_dir: "{{ nginx_old_dir_final }}.adopt-bak-{{ nginx_ts.stdout | trim }}"
        nginx_backup_web: "{{ nginx_web_final }}-adopt-bak-{{ nginx_ts.stdout | trim }}"
        nginx_backup_acme: "{{ nginx_acme_name }}-adopt-bak-{{ nginx_ts.stdout | trim }}"

    - name: Check backup dir is free
      ansible.builtin.stat:
        path: "{{ nginx_backup_dir }}"
      register: nginx_backup_check

    - name: Refuse occupied backup dir
      ansible.builtin.fail:
        msg: "Backup path {{ nginx_backup_dir }} already exists. Inspect it manually and re-run"
      when: nginx_backup_check.stat.exists

    - name: Adopt nginx stack
      block:
        - name: Stop old containers
          ansible.builtin.command:
            argv: ["docker", "stop", "{{ item }}"]
          loop: "{{ [nginx_web_final] + ([nginx_acme_name] if (nginx_acme_found | bool) else []) }}"
          changed_when: true

        - name: Rename old containers aside
          ansible.builtin.command:
            argv: ["docker", "rename", "{{ item.from }}", "{{ item.to }}"]
          loop:
            - {from: "{{ nginx_web_final }}", to: "{{ nginx_backup_web }}"}
          changed_when: true

        - name: Rename old acme container aside
          ansible.builtin.command:
            argv: ["docker", "rename", "{{ nginx_acme_name }}", "{{ nginx_backup_acme }}"]
          changed_when: true
          when: nginx_acme_found | bool

        - name: Ensure target dirs
          ansible.builtin.file:
            path: "{{ nginx_dir }}/{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - ""
            - nginx
            - html
            - webroot
            - acme.sh
            - letsencrypt

        - name: Render compose file
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../templates/nginx/compose.yml.j2"
            dest: "{{ nginx_dir }}/compose.yml"
            mode: "0644"

        - name: Render fallback env file
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../templates/nginx/dotenv.j2"
            dest: "{{ nginx_dir }}/.env"
            mode: "0644"
          vars:
            nginx_domain: "{{ nginx_domain_final }}"
            nginx_email: "{{ nginx_email_final }}"
            nginx_acme_server: "{{ nginx_acme_server_final }}"

        - name: Copy preserved nginx config
          ansible.builtin.copy:
            src: "{{ nginx_conf_src }}"
            dest: "{{ nginx_dir }}/nginx/fallback.conf.template"
            mode: "0644"
            remote_src: true
          when: not (nginx_overwrite_conf | bool)

        - name: Copy stock nginx config
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../files/nginx/fallback.conf.template"
            dest: "{{ nginx_dir }}/nginx/fallback.conf.template"
            mode: "0644"
          when: nginx_overwrite_conf | bool

        - name: Copy preserved html page
          ansible.builtin.copy:
            src: "{{ nginx_html_src }}"
            dest: "{{ nginx_dir }}/html/index.html"
            mode: "0644"
            remote_src: true

        - name: Copy preserved LE state
          ansible.builtin.command:
            argv: ["cp", "-a", "{{ nginx_le_src.rstrip('/') }}/.", "{{ nginx_dir }}/letsencrypt/"]
          changed_when: true

        - name: Copy preserved acme state
          ansible.builtin.command:
            argv: ["cp", "-a", "{{ nginx_acme_src.rstrip('/') }}/.", "{{ nginx_dir }}/acme.sh/"]
          changed_when: true
          when: nginx_acme_src | default('') | length > 0

        - name: Checksum stock nginx config
          ansible.builtin.stat:
            path: "{{ playbook_dir }}/../files/nginx/fallback.conf.template"
            get_checksum: true
          register: nginx_stock_sum
          delegate_to: localhost
          become: false
          when: not (nginx_overwrite_conf | bool)

        - name: Checksum migrated nginx config
          ansible.builtin.stat:
            path: "{{ nginx_dir }}/nginx/fallback.conf.template"
            get_checksum: true
          register: nginx_newconf_sum
          when: not (nginx_overwrite_conf | bool)

        - name: Warn when nginx config differs from stock
          ansible.builtin.debug:
            msg: "Migrated nginx config differs from stock template — review diff: {{ nginx_dir }}/nginx/fallback.conf.template (custom settings preserved)"
          when:
            - not (nginx_overwrite_conf | bool)
            - nginx_stock_sum.stat.checksum | default('') != nginx_newconf_sum.stat.checksum | default('')

        - name: Move old project dir aside
          ansible.builtin.command:
            argv: ["mv", "{{ nginx_old_dir_final }}", "{{ nginx_backup_dir }}"]
          changed_when: true

        - name: Deploy adopted stack
          community.docker.docker_compose_v2:
            project_src: "{{ nginx_dir }}"
            state: present
          register: nginx_deploy

        - name: Wait for nginx socket
          ansible.builtin.stat:
            path: "{{ nginx_socket }}"
          register: nginx_sock
          until: nginx_sock.stat.exists
          retries: 12
          delay: 5

        - name: Allow xray to use the socket
          ansible.builtin.file:
            path: "{{ nginx_socket }}"
            mode: "0666"

        - name: Validate nginx config
          ansible.builtin.command: docker exec {{ nginx_new_web_container }} nginx -t
          changed_when: false

        - name: Check adopted web container is running
          ansible.builtin.command: docker ps -q --filter name={{ nginx_new_web_container }}
          register: nginx_verify
          changed_when: false
          failed_when: false

        - name: Require running adopted container
          ansible.builtin.fail:
            msg: "Adopted container '{{ nginx_new_web_container }}' is not running after up. Check docker logs in {{ nginx_dir }}"
          when: nginx_verify.stdout | default('') | trim | length == 0

        - name: Check adopted port 80 is listening
          ansible.builtin.shell: "ss -tlnp | grep -E ':(80)\\s' || true"
          args:
            executable: /bin/bash
          register: nginx_port_listen
          changed_when: false
          failed_when: false

        - name: Require listening port 80
          ansible.builtin.fail:
            msg: "Port 80 is not listening after up. Check docker logs in {{ nginx_dir }}"
          when: nginx_port_listen.stdout | length == 0

        - name: Check adopted certificates exist
          ansible.builtin.stat:
            path: "{{ nginx_dir }}/letsencrypt/live/{{ nginx_domain_final }}/{{ item }}"
          loop:
            - fullchain.pem
            - privkey.pem
          register: nginx_cert_check

        - name: Require migrated certificates
          ansible.builtin.fail:
            msg: "Certificate files missing after migration in {{ nginx_dir }}/letsencrypt/live/{{ nginx_domain_final }}/. Inspect the old layout manually"
          when: (nginx_cert_check.results | selectattr('stat.exists') | list | length) != 2

        - name: Check ufw is available for auto open
          ansible.builtin.shell: command -v ufw
          args:
            executable: /bin/bash
          register: nginx_ufw_open_bin
          changed_when: false
          failed_when: false
          when: nginx_open_ports | bool

        - name: Warn when ufw is missing for auto open
          ansible.builtin.debug:
            msg: "ufw not found — ports 80,443 NOT opened. Install ufw (base/firewall templates) or open them manually"
          when:
            - nginx_open_ports | bool
            - nginx_ufw_open_bin.rc | default(1) | int != 0

        - name: Open web ports in ufw
          community.general.ufw:
            rule: allow
            port: "{{ item }}"
            proto: tcp
          loop:
            - "80"
            - "443"
          when:
            - nginx_open_ports | bool
            - nginx_ufw_open_bin.rc | default(1) | int == 0

        - name: Show adopt summary
          ansible.builtin.debug:
            msg: "adopted {{ nginx_old_dir_final }} -> {{ nginx_dir }} domain={{ nginx_domain_final }} conf={{ 'stock' if (nginx_overwrite_conf | bool) else 'preserved' }} acme={{ 'moved' if (nginx_acme_src | default('') | length > 0) else 'missing (renewals need re-issue)' }} firewall={{ 'manual' if not (nginx_open_ports | bool) else 'open' }} backup_dir={{ nginx_backup_dir }} (remove backups manually when stable)"
      rescue:
        - name: Take down partial new stack
          community.docker.docker_compose_v2:
            project_src: "{{ nginx_dir | default('/opt/nginx') }}"
            state: absent
          failed_when: false

        - name: Restore old project dir
          ansible.builtin.command:
            argv: ["mv", "{{ nginx_backup_dir | default('/nonexistent-adopt-backup') }}", "{{ nginx_old_dir_final | default('/nonexistent-adopt-source') }}"]
          changed_when: true
          failed_when: false

        - name: Restore old containers
          ansible.builtin.command:
            argv: ["docker", "rename", "{{ item }}", "{{ item | regex_replace('-adopt-bak-[0-9]+$', '') }}"]
          loop: "{{ [nginx_backup_web | default(''), nginx_backup_acme | default('')] | select | list }}"
          changed_when: true
          failed_when: false

        - name: Start old containers
          ansible.builtin.command:
            argv: ["docker", "start", "{{ item }}"]
          loop: "{{ [nginx_web_final | default('unknown')] + ([nginx_acme_name] if (nginx_acme_found | default(false) | bool) else []) }}"
          changed_when: true
          failed_when: false

        - name: Fail with rollback note
          ansible.builtin.fail:
            msg: "Adopt failed ({{ ansible_failed_result.msg | default('see above') }}); rollback attempted — verify old containers manually"
