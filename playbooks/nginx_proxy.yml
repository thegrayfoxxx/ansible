---
- name: Deploy nginx proxy (TLS termination + Xray route + fallback stub)
  hosts: "{{ target }}"
  gather_facts: false
  become: true
  vars:
    nginx_domain: ""
    nginx_proxy_path: "/xray"
    nginx_proxy_upstream: "http://unix:/dev/shm/xray.sock"
    nginx_email: ""
    nginx_html: ""
    nginx_dir: /opt/nginx_proxy
    nginx_staging: false
    nginx_force_issue: false
    nginx_open_ports: false
    nginx_web_container: nginx-proxy-web
    nginx_acme_container: nginx-proxy-acme
    nginx_socket: /dev/shm/xray.sock
    # Доверенные прокси/CDN перед nginx (CIDR через запятую или по строке).
    # Пусто — X-Forwarded-For не используется (иначе любой клиент подделывает IP).
    nginx_real_ip_from: ""
    nginx_reload_interval: 43200
  tasks:
    - name: Normalize project dir
      ansible.builtin.set_fact:
        nginx_dir: "{{ (nginx_dir | default('') | trim) or '/opt/nginx_proxy' }}"

    - name: Validate project dir
      ansible.builtin.fail:
        msg: "nginx_dir must be an absolute path, got '{{ nginx_dir }}'"
      when: not (nginx_dir is match('^/.+'))

    - name: Validate domain value
      ansible.builtin.fail:
        msg: "nginx_domain must be a plain hostname like de1.example.com (no scheme, slashes or spaces), got '{{ nginx_domain }}'"
      when: nginx_domain | default('') | trim | length == 0
        or not (nginx_domain | trim is match('^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$'))

    # Значения попадают в конфиг nginx: строгие regex, чтобы `;`/`{`/пробел не
    # дописали в конфиг свои директивы.
    - name: Validate proxy path
      ansible.builtin.fail:
        msg: "nginx_proxy_path must look like /xray or /api/v1/ (letters, digits, . _ ~ / -), got '{{ nginx_proxy_path }}'"
      when: not (nginx_proxy_path | default('') | trim is match('^/[A-Za-z0-9._~/-]*$'))

    - name: Validate proxy upstream
      ansible.builtin.fail:
        msg: "nginx_proxy_upstream must be http(s)://unix:/path.sock, http(s)://host:port or http(s)://[ipv6]:port (optional /path), got '{{ nginx_proxy_upstream }}'"
      when: >-
        not (nginx_proxy_upstream | default('') | trim is match(
          '^https?://(unix:/[A-Za-z0-9._/-]+|[A-Za-z0-9.-]+:[0-9]{1,5}(/[A-Za-z0-9._~/-]*)?|\\[[0-9A-Fa-f:]+\\]:[0-9]{1,5}(/[A-Za-z0-9._~/-]*)?)$'))

    - name: Normalize trusted real-ip sources
      ansible.builtin.set_fact:
        nginx_real_ip_from_list: "{{ ((nginx_real_ip_from | default('', true)).replace(',', '\n').splitlines() if (nginx_real_ip_from | default('', true)) is string else (nginx_real_ip_from | default([], true))) | map('trim') | select | list }}"

    - name: Validate trusted real-ip sources
      ansible.builtin.fail:
        msg: "nginx_real_ip_from must be IPv4/IPv6 addresses or CIDRs, got: {{ nginx_bad | join(', ') }}"
      vars:
        nginx_bad: "{{ nginx_real_ip_from_list | reject('match', '^[0-9A-Fa-f:.]+(/[0-9]{1,3})?$') | list }}"
      when: nginx_bad | length > 0

    - name: Require fallback HTML
      ansible.builtin.fail:
        msg: "nginx_html is empty. Paste your own index.html into the survey field"
      when: nginx_html | default('') | trim | length == 0

    - name: Check Debian family
      ansible.builtin.stat:
        path: /etc/debian_version
      register: nginx_debian

    - name: Require Debian or Ubuntu
      ansible.builtin.fail:
        msg: "Nginx proxy needs Debian or Ubuntu"
      when: not nginx_debian.stat.exists

    - name: Check docker is available
      ansible.builtin.shell: command -v docker
      args:
        executable: /bin/bash
      register: nginx_docker_bin
      changed_when: false
      failed_when: false

    - name: Require docker on node
      ansible.builtin.fail:
        msg: "docker not found. Run the docker template on this host first"
      when: nginx_docker_bin.rc != 0

    - name: Check own web container is running
      ansible.builtin.command:
        argv: ["docker", "ps", "-q", "--filter", "name=^{{ nginx_web_container }}$"]
      register: nginx_own_web
      changed_when: false
      failed_when: false

    - name: Check port 80 is free for ACME http-01
      ansible.builtin.shell: "ss -tlnp | grep -E ':(80)\\s' || true"
      args:
        executable: /bin/bash
      register: nginx_port_busy
      changed_when: false
      failed_when: false

    - name: Refuse busy port 80
      ansible.builtin.fail:
        msg: "Port 80 is already listening on this host ({{ nginx_port_busy.stdout | trim }}). ACME http-01 needs it free"
      when:
        - nginx_own_web.stdout | default('') | trim | length == 0
        - nginx_port_busy.stdout | length > 0

    - name: Check port 443 is free for nginx
      ansible.builtin.shell: "ss -tlnp | grep -E ':(443)\\s' || true"
      args:
        executable: /bin/bash
      register: nginx_port443_busy
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse busy port 443
      ansible.builtin.fail:
        msg: "Port 443 is already listening on this host ({{ nginx_port443_busy.stdout | trim }}). nginx_proxy stands in front on 443 — stop that service first"
      when:
        - nginx_own_web.stdout | default('') | trim | length == 0
        - nginx_port443_busy.stdout | length > 0

    - name: Ensure project dir
      ansible.builtin.file:
        path: "{{ nginx_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure subdirs
      ansible.builtin.file:
        path: "{{ nginx_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - ""
        - nginx
        - html
        - webroot
        - acme.sh
        - letsencrypt
        - "letsencrypt/live/{{ nginx_domain | trim }}"

    - name: Render compose file
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/nginx/compose_proxy.yml.j2"
        dest: "{{ nginx_dir }}/compose.yml"
        mode: "0644"
      register: nginx_compose_render

    - name: Render nginx config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/nginx/nginx_proxy.conf.template.j2"
        dest: "{{ nginx_dir }}/nginx/nginx_proxy.conf.template"
        mode: "0644"
      vars:
        nginx_real_ip_from: "{{ nginx_real_ip_from_list }}"
      register: nginx_conf_copy

    - name: Render index.html
      ansible.builtin.copy:
        content: "{{ nginx_html }}"
        dest: "{{ nginx_dir }}/html/index.html"
        mode: "0644"
      register: nginx_html_copy

    - name: Render dotenv
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/nginx/dotenv.j2"
        dest: "{{ nginx_dir }}/.env"
        mode: "0600"
      vars:
        nginx_acme_server: "{{ 'https://acme-staging-v02.api.letsencrypt.org/directory' if (nginx_staging | bool) else 'https://acme-v02.api.letsencrypt.org/directory' }}"
      diff: false

    - name: Prepare certificate
      ansible.builtin.include_tasks: tasks/nginx_cert_prepare.yml

    - name: Deploy proxy stack
      community.docker.docker_compose_v2:
        project_src: "{{ nginx_dir }}"
        state: present
        pull: missing
      register: nginx_deploy

    - name: Restart web container to pick up changed config or page
      ansible.builtin.command:
        argv: ["docker", "restart", "{{ nginx_web_container }}"]
      changed_when: true
      when:
        - (nginx_conf_copy is changed) or (nginx_html_copy is changed)
        - not (nginx_deploy is changed)

    - name: Wait for nginx to be ready
      ansible.builtin.wait_for:
        port: 443
        delay: 2
        timeout: 30

    - name: Issue and install certificate
      ansible.builtin.include_tasks: tasks/nginx_cert_issue.yml

    - name: Check ufw is available for auto open
      ansible.builtin.shell: command -v ufw
      args:
        executable: /bin/bash
      register: nginx_ufw_bin
      changed_when: false
      failed_when: false
      when: nginx_open_ports | bool

    - name: Warn when ufw is missing for auto open
      ansible.builtin.debug:
        msg: "ufw not found — ports 80,443 NOT opened. Install ufw (base/firewall templates) or open them manually"
      when:
        - nginx_open_ports | bool
        - nginx_ufw_bin.rc | default(1) | int != 0

    - name: Open 80 and 443 in ufw
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "80"
        - "443"
      when:
        - nginx_open_ports | bool
        - nginx_ufw_bin.rc | default(1) | int == 0

    - name: Show deploy summary
      ansible.builtin.debug:
        msg: "deployed nginx_proxy {{ nginx_dir }} domain={{ nginx_domain }} path={{ nginx_proxy_path }} upstream={{ nginx_proxy_upstream }} ports={{ 'open' if (nginx_open_ports | bool) else 'manual' }} cert={{ 'issued' if (nginx_issue is changed) else ((('existing (staging)' if (nginx_cert_is_staging | bool) else 'existing') if not (nginx_cert_missing | bool) else 'missing')) }}{{ ' (staging requested — re-run with staging=false for a trusted cert)' if (nginx_staging | bool) else '' }}"
