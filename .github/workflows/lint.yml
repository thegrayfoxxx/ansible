---
name: lint

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.12.3

      - name: Install tools
        run: uv sync --locked

      - name: Install Ansible collections
        run: uv run --locked ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: git ls-files -z -- '*.yml' '*.yaml' | xargs -0 uv run --locked yamllint

      - name: shellcheck
        run: uv run --locked shellcheck scripts/*.sh

      - name: python compile
        run: uv run --locked python -m py_compile scripts/semaphore_bootstrap.py

      - name: syntax-check all playbooks
        run: uv run --locked scripts/syntax_check.sh

      - name: ansible-lint
        run: uv run --locked ansible-lint
