---
# Input: compose_project_dir (absolute), compose_project_container (optional).
# Output: compose_project_file (basename or empty), compose_project_exists.
# Every invocation resets results; callers must save them before another call.
- name: Validate compose project directory
  ansible.builtin.assert:
    that:
      - compose_project_dir is match('^/.+')
    fail_msg: "Compose project directory must be absolute: {{ compose_project_dir }}"

- name: Read compose file label
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - '{{ ''{{ index .Config.Labels "com.docker.compose.project.config_files" }}'' }}'
      - "{{ compose_project_container }}"
  register: compose_project_inspect
  changed_when: false
  failed_when: false
  check_mode: false
  when: compose_project_container | default('') | length > 0

- name: Stat supported compose files
  ansible.builtin.stat:
    path: "{{ compose_project_dir | regex_replace('/+$', '') }}/{{ item }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: [compose.yml, compose.yaml, docker-compose.yml, docker-compose.yaml]
  register: compose_project_stats

- name: Resolve compose candidates and labels
  ansible.builtin.set_fact:
    compose_project_candidates: "{{ compose_project_stats.results | selectattr('stat.isreg', 'defined') | selectattr('stat.isreg') | map(attribute='item') | list }}"
    compose_project_label_files: "{{ (compose_project_inspect.stdout | default('')).split(',') | map('trim') | select('match', '^/') | list }}"

- name: Resolve labels belonging to this directory
  ansible.builtin.set_fact:
    compose_project_local_labels: >-
      {{ compose_project_label_files | map('dirname') | map('regex_replace', '/+$', '')
         | select('equalto', compose_project_dir | regex_replace('/+$', '')) | list }}

- name: Refuse unsupported compose file sets
  ansible.builtin.assert:
    that:
      - compose_project_label_files | length == 1
      - (compose_project_label_files | first | basename) in compose_project_candidates
    fail_msg: >-
      Unsupported or missing Compose configuration in {{ compose_project_dir }}:
      container labels={{ compose_project_label_files }}; found={{ compose_project_candidates }}.
      Expected one existing standard Compose file; multiple-file projects are unsupported.
  when: compose_project_local_labels | length > 0

- name: Refuse ambiguous compose files
  ansible.builtin.assert:
    that:
      - compose_project_candidates | length <= 1 or compose_project_local_labels | length == 1
    fail_msg: >-
      Ambiguous Compose files in {{ compose_project_dir }}: {{ compose_project_candidates }}.
      No container label selects one file. Keep only the intended configuration in this directory.

- name: Select compose file
  ansible.builtin.set_fact:
    compose_project_file: >-
      {{ (compose_project_label_files | first | basename) if (compose_project_local_labels | length == 1)
         else (compose_project_candidates | first | default('')) }}
    compose_project_exists: "{{ compose_project_candidates | length > 0 }}"
