---
- name: Check node port is free before first start
  ansible.builtin.shell: "ss -tlnp | grep -E ':{{ remnanode_port_final }}\\s' || true"
  args:
    executable: /bin/bash
  register: remnanode_port_busy
  changed_when: false
  failed_when: false
  when: not (remnanode_container_exists | bool)

- name: Refuse a busy node port
  ansible.builtin.fail:
    msg: "Port {{ remnanode_port_final }} is already listening on {{ inventory_hostname }} and no remnanode container exists. Pick another port in the panel (or stop the service), then re-run"
  when:
    - not (remnanode_container_exists | bool)
    - remnanode_port_busy.stdout | default('') | length > 0

- name: Deploy remnawave stack
  community.docker.docker_compose_v2:
    project_src: "{{ remnanode_dir }}"
    state: present
    pull: missing
    recreate: "{{ 'always' if (remnanode_xray_changed | bool) or (remnanode_zapret_changed | default(false) | bool) else 'auto' }}"
  register: remnanode_compose_up

- name: Check remnanode container is running
  ansible.builtin.command: docker inspect {{ remnanode_agent_container }}
  register: remnanode_verify
  changed_when: false
  failed_when: false
  until: >-
    remnanode_verify.rc == 0 and
    ((remnanode_verify.stdout | from_json | first).State.Running | default(false) | bool)
  retries: 6
  delay: 2

- name: Require running remnanode container
  ansible.builtin.fail:
    msg: "Container '{{ remnanode_agent_container }}' is not running after compose up. Check docker logs in {{ remnanode_dir }}"
  when: >-
    remnanode_verify.rc != 0 or
    not ((remnanode_verify.stdout | from_json | first).State.Running | default(false) | bool)

- name: Wait for node port to listen
  ansible.builtin.wait_for:
    port: "{{ remnanode_port_final }}"
    state: started
    timeout: 30
    delay: 2
  register: remnanode_port_wait

- name: Record installed xray version
  ansible.builtin.copy:
    content: "{{ remnanode_xray_version_norm }}\n"
    dest: "{{ remnanode_dir }}/.xray-core.version"
    mode: "0644"
  when:
    - remnanode_xray_mode_effective | default(remnanode_xray_mode) == 'version'
    - (remnanode_xray_changed | bool) or not (remnanode_target_xray_marker_exists | bool)

- name: Check firewall state
  ansible.builtin.include_tasks: ufw_check.yml

- name: Resolve stack summary
  ansible.builtin.set_fact:
    remnanode_up_changed: "{{ remnanode_compose_up.changed | default(false) }}"
