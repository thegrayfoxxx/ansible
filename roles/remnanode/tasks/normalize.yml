---
- name: Normalize project dir
  ansible.builtin.set_fact:
    # *_effective вместо set_fact поверх remnanode_dir: значения survey приходят
    # extra vars, и set_fact не может их перекрыть — пустое поле оставалось "".
    remnanode_dir_effective: "{{ (remnanode_dir | default('', true) | string | trim) or '/opt/remnanode' }}"

- name: Validate project dir
  ansible.builtin.fail:
    msg: "remnanode_dir must be an absolute path, got '{{ remnanode_dir_effective }}'"
  when: not (remnanode_dir_effective is match('^/.+'))

- name: Resolve geodata paths
  ansible.builtin.set_fact:
    remnanode_geo_dir: "{{ (remnanode_dir_effective | regex_replace('/+$', '')) }}/xray/share"
    remnanode_zapret_file: "{{ (remnanode_dir_effective | regex_replace('/+$', '')) }}/xray/share/zapret.dat"

- name: Normalize agent container name
  ansible.builtin.set_fact:
    remnanode_agent_container_effective: "{{ (remnanode_agent_container | default('', true) | string | trim) or 'remnanode' }}"
    remnanode_node_image_effective: "{{ remnanode_node_image | default('', true) | string | trim }}"

- name: Validate agent container name
  ansible.builtin.fail:
    msg: "Remnanode container name must match ^[a-zA-Z0-9_.-]+$, got '{{ remnanode_agent_container_effective }}'"
  when: remnanode_agent_container_effective is not match('^[a-zA-Z0-9_.-]+$')

- name: Normalize xray log dir
  ansible.builtin.set_fact:
    remnanode_log_dir_effective: >-
      {{ (remnanode_log_dir_effective | default(remnanode_log_dir | default('', true), true) | string | trim)
         if ((remnanode_log_dir_effective | default(remnanode_log_dir | default('', true), true) | string | trim | lower) not in ['', 'keep', 'current'])
         else '/var/log/remnanode' }}

- name: Validate xray log dir
  ansible.builtin.fail:
    msg: "remnanode_log_dir must be an absolute path, got '{{ remnanode_log_dir_effective }}'"
  when: not (remnanode_log_dir_effective is match('^/.+'))

- name: Normalize xray log settings
  ansible.builtin.set_fact:
    remnanode_log_max_size_effective: >-
      {{ (remnanode_log_max_size_effective | default(remnanode_log_max_size | default('', true), true) | string | trim)
         if ((remnanode_log_max_size_effective | default(remnanode_log_max_size | default('', true), true) | string | trim | lower) not in ['', 'keep', 'current'])
         else '100M' }}
    remnanode_log_keep_effective: >-
      {{ (remnanode_log_keep_effective | default(remnanode_log_keep | default('', true), true) | string | trim)
         if ((remnanode_log_keep_effective | default(remnanode_log_keep | default('', true), true) | string | trim | lower) not in ['', 'keep', 'current'])
         else '5' }}

- name: Validate xray mode
  ansible.builtin.fail:
    msg: "remnanode_xray_mode must be keep, image or version, got '{{ remnanode_xray_mode }}'"
  when:
    - remnanode_validate_xray | default(true) | bool
    - remnanode_xray_mode not in ['', 'keep', 'image', 'version']

- name: Require xray version for mode=version
  ansible.builtin.fail:
    msg: "remnanode_xray_version is required when remnanode_xray_mode=version"
  when:
    - remnanode_validate_xray | default(true) | bool
    - remnanode_xray_mode == 'version'
    - remnanode_xray_version_norm | length == 0

- name: Refuse xray version outside mode=version
  ansible.builtin.fail:
    msg: "remnanode_xray_version is set but remnanode_xray_mode={{ remnanode_xray_mode }}. Use mode=version to install a version, or clear the version"
  when:
    - remnanode_validate_xray | default(true) | bool
    - remnanode_xray_mode in ['', 'keep', 'image']
    - remnanode_xray_version | default('', true) | string | trim | length > 0

- name: Validate xray version format
  ansible.builtin.fail:
    msg: "remnanode_xray_version must look like 26.10.21 or v26.10.21, got '{{ remnanode_xray_version }}'"
  when:
    - remnanode_validate_xray | default(true) | bool
    - remnanode_xray_version_norm | length > 0
    - not (remnanode_xray_version_norm is match('^[0-9]+\.[0-9]+\.[0-9]+$'))

- name: Validate xray log max size
  ansible.builtin.fail:
    msg: "remnanode_log_max_size must be like 100M (number + k/M/G), got '{{ remnanode_log_max_size_effective }}'"
  when:
    - remnanode_log_max_size_effective | default('') | string | trim | length > 0
    - not (remnanode_log_max_size_effective | default('') | string | trim is match('(?i)^[0-9]+[kMG]$'))

- name: Validate xray log keep count
  ansible.builtin.fail:
    msg: "remnanode_log_keep must be 1..30, got '{{ remnanode_log_keep_effective }}'"
  when:
    - remnanode_log_keep_effective | default('') | string | trim | length > 0
    - (remnanode_log_keep_effective | int < 1) or (remnanode_log_keep_effective | int > 30)

- name: Normalize geodata file list
  ansible.builtin.set_fact:
    remnanode_geo_files_norm: >-
      {{ ((remnanode_geo_files | list)
          if (remnanode_geo_files is iterable and remnanode_geo_files is not string and remnanode_geo_files is not mapping)
          else ((remnanode_geo_files | default('', true) | string) | regex_findall('[^,\s]+')))
         | map('string') | map('trim') | select | list }}

- name: Resolve geodata input tokens
  ansible.builtin.set_fact:
    remnanode_geo_files_tokens: "{{ remnanode_geo_files_norm | select('match', '^(keep|current|none|-)$') | list }}"

- name: Validate geodata input tokens
  ansible.builtin.fail:
    msg: "remnanode_geo_files mixes mode tokens (keep/current/none) with file names: {{ remnanode_geo_files_norm | join(', ') }}"
  when:
    - remnanode_geo_files_tokens | length > 0
    - remnanode_geo_files_norm | length > 1

- name: Validate geodata file names
  ansible.builtin.fail:
    msg: "remnanode_geo_files accepts file names only (no paths), matching ^[A-Za-z0-9_.-]+$, got '{{ item }}'"
  loop: "{{ remnanode_geo_files_norm }}"
  when:
    - remnanode_geo_files_tokens | length == 0
    - (item is not match('^[A-Za-z0-9_.-]+$')) or (item in ['.', '..'])

- name: Validate geodata file list has no duplicates
  ansible.builtin.fail:
    msg: "remnanode_geo_files contains duplicate names: {{ remnanode_geo_files_norm | join(', ') }}"
  when:
    - remnanode_geo_files_tokens | length == 0
    - (remnanode_geo_files_norm | length) != (remnanode_geo_files_norm | unique | length)

- name: Resolve geodata input mode and file names
  ansible.builtin.set_fact:
    remnanode_geo_files_mode: >-
      {{ 'keep' if ((remnanode_geo_files_norm | length) == 0)
          or (((remnanode_geo_files_tokens | length) == 1) and (remnanode_geo_files_tokens[0] in ['keep', 'current']))
         else ('none' if (((remnanode_geo_files_tokens | length) == 1) and (remnanode_geo_files_tokens[0] in ['none', '-']))
               else 'list') }}
    remnanode_geo_files_names: "{{ remnanode_geo_files_norm if (remnanode_geo_files_tokens | length == 0) else [] }}"

- name: Normalize zapret mode
  ansible.builtin.set_fact:
    remnanode_zapret_mode_norm: >-
      {{ 'off' if (remnanode_zapret_mode is sameas false)
         else ('present' if (remnanode_zapret_mode is sameas true)
               else ((remnanode_zapret_mode | default('keep', true) | string | trim | lower) or 'keep')) }}

- name: Validate zapret mode
  ansible.builtin.fail:
    msg: "remnanode_zapret_mode must be keep, off, present or latest, got '{{ remnanode_zapret_mode_norm }}'"
  when: remnanode_zapret_mode_norm not in ['keep', 'off', 'present', 'latest']

- name: Validate zapret URL
  ansible.builtin.fail:
    msg: "remnanode_zapret_url must be an https URL, got '{{ remnanode_zapret_url | default('') }}'"
  when:
    - remnanode_zapret_mode_norm in ['present', 'latest']
    - not (remnanode_zapret_url | default('') is match('^https://'))
