---
- name: Extract credentials from running container
  ansible.builtin.set_fact:
    remnanode_env_port_current: "{{ (remnanode_inspect_env | default([]) | select('match', '^NODE_PORT=') | list | first | default('') | regex_replace('^NODE_PORT=', '') | regex_replace('^[\\x22\\x27]|[\\x22\\x27]$', '')) | trim }}"
    remnanode_env_secret_current: "{{ (remnanode_inspect_env | default([]) | select('match', '^SECRET_KEY=') | list | first | default('') | regex_replace('^SECRET_KEY=', '') | regex_replace('^[\\x22\\x27]|[\\x22\\x27]$', '')) | trim }}"
  no_log: true

- name: Read env file when container env is incomplete
  ansible.builtin.slurp:
    src: "{{ remnanode_old_dir_final }}/.env"
  register: remnanode_old_env_content
  no_log: true
  when:
    - remnanode_old_env_exists | bool
    - (remnanode_env_port_current | length == 0) or (remnanode_env_secret_current | length == 0)

- name: Extract credentials from env file
  ansible.builtin.set_fact:
    remnanode_file_port: "{{ ((remnanode_old_env_content.content | b64decode).splitlines() | select('match', '^NODE_PORT=') | list | first | default('') | regex_replace('^NODE_PORT=', '') | regex_replace('^[\\x22\\x27]|[\\x22\\x27]$', '')) | trim }}"
    remnanode_file_secret: "{{ ((remnanode_old_env_content.content | b64decode).splitlines() | select('match', '^SECRET_KEY=') | list | first | default('') | regex_replace('^SECRET_KEY=', '') | regex_replace('^[\\x22\\x27]|[\\x22\\x27]$', '')) | trim }}"
  no_log: true
  when: remnanode_old_env_content is defined and (remnanode_old_env_content.content | default('')) | length > 0

- name: Resolve node credentials
  ansible.builtin.set_fact:
    remnanode_port_final: "{{ remnanode_env_port_current or (remnanode_file_port | default('')) }}"
    remnanode_node_secret: "{{ remnanode_env_secret_current or (remnanode_file_secret | default('')) }}"
    remnanode_creds_source: "{{ 'running container' if (remnanode_env_port_current | length > 0 and remnanode_env_secret_current | length > 0) else ('compose .env' if (remnanode_file_port | default('') | length > 0 and remnanode_file_secret | default('') | length > 0) else 'partial' if ((remnanode_env_port_current | length > 0) or (remnanode_env_secret_current | length > 0) or (remnanode_file_port | default('') | length > 0) or (remnanode_file_secret | default('') | length > 0)) else 'none') }}"
  no_log: true

- name: Validate discovered credentials
  ansible.builtin.fail:
    msg: "No usable NODE_PORT/SECRET_KEY found on {{ inventory_hostname }} (checked running container and {{ remnanode_old_dir_final }}/.env)"
  when:
    - remnanode_require_credentials | default(true) | bool
    - (remnanode_port_final | default('') | string | length == 0)
      or (remnanode_port_final | int < 1) or (remnanode_port_final | int > 65535)
      or (remnanode_node_secret | default('') | length == 0)
