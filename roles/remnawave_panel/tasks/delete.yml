---
- name: Require node UUID for panel removal
  ansible.builtin.fail:
    msg: "Node UUID is unknown — cannot remove the panel entry"
  when: remnawave_node_uuid | default('') | trim | length == 0

- name: Remove panel node
  ansible.builtin.uri:
    url: "{{ remnawave_panel_base }}/api/nodes/{{ remnawave_node_uuid }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ remnawave_token_final }}"
      Accept: application/json
    status_code: [204, 404]
    timeout: 30
    validate_certs: "{{ remnawave_validate_certs | bool }}"
  register: remnawave_node_delete
  failed_when: false
  delegate_to: localhost
  become: false
  no_log: true

- name: Check delete response
  ansible.builtin.include_tasks: api_check.yml
  vars:
    remnawave_api_resp: "{{ remnawave_node_delete }}"
    remnawave_api_what: "DELETE /api/nodes/{{ remnawave_node_uuid }}"
    remnawave_api_ok: [200, 204, 404]

- name: Record panel removal
  ansible.builtin.set_fact:
    remnawave_node_deleted: "{{ (remnawave_node_delete.status | default(0) | int) in [200, 204] }}"
