---
- name: Fetch panel nodes
  ansible.builtin.uri:
    url: "{{ remnawave_panel_base }}/api/nodes"
    headers:
      Authorization: "Bearer {{ remnawave_token_final }}"
      Accept: application/json
    return_content: true
    timeout: 30
    validate_certs: "{{ remnawave_validate_certs | bool }}"
  register: remnawave_nodes_resp
  delegate_to: localhost
  become: false
  no_log: true

- name: Resolve panel node list
  ansible.builtin.set_fact:
    remnawave_nodes: >-
      {{ ((remnawave_nodes_resp.json.response | default({})).get('nodes', [])
          if ((remnawave_nodes_resp.json.response | default({})) is mapping)
          else (remnawave_nodes_resp.json.response | default([]))) }}
  delegate_to: localhost
  become: false

- name: Resolve node by name
  ansible.builtin.set_fact:
    remnawave_existing: "{{ (remnawave_nodes | selectattr('name', 'equalto', remnawave_node_name) | list | first) | default({}) }}"
    remnawave_node_matches: "{{ remnawave_nodes | selectattr('name', 'equalto', remnawave_node_name) | list }}"
  delegate_to: localhost
  become: false
  when: remnawave_node_name | default('') | trim | length > 0

- name: Resolve node UUID
  ansible.builtin.set_fact:
    remnawave_node_uuid: "{{ remnawave_existing.uuid | default('') }}"
  delegate_to: localhost
  become: false
