[defaults]
# NOTE: MITM risk on first connect (esp. init_node on fresh hosts). Homelab tradeoff;
# safer alternative: host_key_checking=True + ssh_args StrictHostKeyChecking=accept-new.
host_key_checking = False
retry_files_enabled = False
stdout_callback = ansible.builtin.default
collections_path = ./collections
roles_path = ./roles
deprecation_warnings = True
interpreter_python = auto_silent

[callback_default]
result_format = yaml

[ssh_connection]
pipelining = True
