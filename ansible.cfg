[defaults]
# Ключ хоста проверяется; новый хост принимается при первом подключении
# (StrictHostKeyChecking=accept-new в ssh_args ниже), а смена ключа известного
# хоста — ошибка (возможный MITM). После переустановки ноды удали её строку:
#   ssh-keygen -R <host>
host_key_checking = True
retry_files_enabled = False
stdout_callback = ansible.builtin.default
collections_path = ./collections
roles_path = ./roles
deprecation_warnings = True
interpreter_python = auto_silent

[callback_default]
result_format = yaml

[ssh_connection]
pipelining = True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
