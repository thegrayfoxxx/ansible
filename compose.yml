services:
  semaphore:
    image: semaphoreui/semaphore:v2.19.12
    restart: unless-stopped
    # По умолчанию только localhost: Docker публикует порты в обход UFW, а UI
    # идёт по HTTP. Доступ — через SSH-туннель или reverse proxy с TLS.
    # SEMAPHORE_BIND=0.0.0.0 — осознанно открыть наружу.
    ports:
      - "${SEMAPHORE_BIND:-127.0.0.1}:${SEMAPHORE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      SEMAPHORE_DB_DIALECT: sqlite
      SEMAPHORE_ADMIN: "${SEMAPHORE_ADMIN:?Set SEMAPHORE_ADMIN in .env}"
      SEMAPHORE_ADMIN_PASSWORD: "${SEMAPHORE_ADMIN_PASSWORD:?Set SEMAPHORE_ADMIN_PASSWORD in .env}"
      SEMAPHORE_ADMIN_NAME: "${SEMAPHORE_ADMIN_NAME:?Set SEMAPHORE_ADMIN_NAME in .env}"
      SEMAPHORE_ADMIN_EMAIL: "${SEMAPHORE_ADMIN_EMAIL:?Set SEMAPHORE_ADMIN_EMAIL in .env}"
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: "${SEMAPHORE_ACCESS_KEY_ENCRYPTION:?Set SEMAPHORE_ACCESS_KEY_ENCRYPTION in .env}"
    volumes:
      - semaphore_data:/var/lib/semaphore
      - semaphore_config:/etc/semaphore
      - semaphore_tmp:/tmp/semaphore

volumes:
  semaphore_data:
  semaphore_config:
  semaphore_tmp:
